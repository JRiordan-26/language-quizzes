// ---------- 100-Word Quiz (German & Italian) ----------
// 100 words in 10 sets of 10: each pass through a set removes the words
// answered correctly, repeating until the set is empty. Then the sets pair up
// into 5 sets of 20, worked down the same way. 40 of the 100 are repeats from
// the Daily Exercise / earlier 100-word quizzes, 60 are new words.
const HUNDRED_LANGS=['german','italian'];
function getHundred(lang){
  try{ const o=JSON.parse(localStorage.getItem('lq_hundred_'+lang)||'null')||{};
    return {list:o.list||[], phase:o.phase||0, tr:o.tr||0, rem:o.rem||[], past:o.past||[], n:o.n||0};
  }catch(e){ return {list:[],phase:0,tr:0,rem:[],past:[],n:0}; }
}
function saveHundred(lang,H){ localStorage.setItem('lq_hundred_'+lang, JSON.stringify(H)); }
function hSetInfo(H){ return H.phase===2 ? {size:20,count:5} : {size:10,count:10}; }
function hSetIdx(H){ const {size}=hSetInfo(H); return [...Array(size).keys()].map(k=>H.tr*size+k); }
// Shared list builder for the 100-Word Quiz and the 50-Word Climb: 40% repeats
// (daily history first, then words from completed quizzes of either kind),
// 60% new. Words active or tested in EITHER quiz never come back as "new".
function buildMasteryList(lang, size){
  const key=t=>stripArticle(foldTxt(t));
  const learned=getLearned(lang);
  const H=getHundred(lang);
  const Ls=climbSlots(lang);
  const nRep=Math.round(size*0.4);
  const pastSet=new Set([...H.past.flat(), ...Ls.flatMap(L=>[...L.past.flat(), ...L.tested])].map(key));
  const pastPool=[...H.past.flat(), ...Ls.flatMap(L=>L.past.flat())];
  const D=getDaily(lang);
  const used=new Set();
  for(const x of H.list) used.add(key(x.t));   // active in the other quizzes
  for(const L of Ls) for(const x of L.list) used.add(key(x.t));
  // gloss lookup + ordered "new word" candidates: Duolingo path, then course units, then custom
  const pool=[...duoFlat(lang),
    ...DATA[lang].courses.filter(c=>!c.id.startsWith('duo_')).flatMap(c=>c.units).filter(u=>u.type==='vocab').flatMap(u=>u.items||[]),
    ...customUnitsFor(lang).flatMap(u=>u.items||[])].filter(it=>it&&it.t&&it.e);
  const gloss=new Map();
  for(const it of pool){ const k=key(it.t); if(k&&!gloss.has(k)) gloss.set(k,it); }
  // 40% repeats: daily-tested words first (lowest success rate first), then past-quiz words
  const reps=[];
  const daily=Object.entries(D.stats).sort((a,b)=>wordRate(a[1])-wordRate(b[1]));
  for(const [t,s] of daily){
    if(reps.length>=nRep) break;
    const k=key(t); if(!k||used.has(k)||learned.has(t)) continue;
    const e=s.e||((gloss.get(k)||{}).e); if(!e) continue;
    used.add(k); reps.push({t,e,r:1});
  }
  if(reps.length<nRep){
    for(const t of shuffle(pastPool)){
      if(reps.length>=nRep) break;
      const k=key(t); if(!k||used.has(k)) continue;
      const g=gloss.get(k); if(!g||learned.has(g.t)) continue;
      used.add(k); reps.push({t:g.t,e:g.e,r:1});
    }
  }
  // 60% new words (more if the repeat pool ran short)
  const dailySet=new Set(Object.keys(D.stats).map(key));
  const out=[...reps];
  for(const it of pool){
    if(out.length>=size) break;
    const k=key(it.t); if(!k||used.has(k)) continue;
    if(dailySet.has(k)||pastSet.has(k)||learned.has(it.t)) continue;
    used.add(k); out.push({t:it.t,e:it.e});
  }
  // sources exhausted: fall back to anything not already picked
  for(const it of pool){
    if(out.length>=size) break;
    const k=key(it.t); if(!k||used.has(k)) continue;
    used.add(k); out.push({t:it.t,e:it.e});
  }
  return shuffle(out).slice(0,size);
}
// If every word of the current set was already cleared (e.g. the quiz was
// quit right after the last correct answer), advance to the next set/round.
function hundredAdvance(lang){
  const H=getHundred(lang);
  if(!H.phase || H.rem.length) return H;
  H.tr++;
  const {count}=hSetInfo(H);
  if(H.tr>=count){
    if(H.phase===1){ H.phase=2; H.tr=0; H.rem=hSetIdx(H); }
    else {
      H.past.push(H.list.map(x=>x.t));
      if(H.past.length>10) H.past=H.past.slice(-10);
      H.list=[]; H.phase=0; H.tr=0; H.rem=[];
    }
  } else H.rem=hSetIdx(H);
  saveHundred(lang,H);
  return getHundred(lang);
}
function startHundredPass(){
  const lang=state.hundredLang;
  const H=hundredAdvance(lang);
  if(!H.rem.length){ state.hq=null; render(); return; }
  state.hq={mode:'q', order:shuffle([...H.rem]), pos:0, okIdx:[], nOk:0};
  render();
}
function renderHundred(){
  const lang=state.hundredLang, d=DATA[lang];
  if(!state.hq) migrateMastery(lang);
  const H=hundredAdvance(lang);
  const hq=state.hq;
  if(!hq){
    // ----- overview -----
    app.appendChild($(`<span class="backlink" id="back">← Home</span>`));
    app.querySelector('#back').onclick=()=>{ state.screen='home'; render(); };
    app.appendChild($(`<h1>${d.flag} 💯 100-Word Quiz</h1>`));
    app.appendChild($(`<div class="sub">100 words · 10 sets of 10, then 5 sets of 20. Every pass removes the words you got right until the set is done. 40 words are review (Daily Exercise &amp; past 100-word quizzes), 60 are new.</div>`));
    const card=$(`<div class="card"></div>`);
    if(!H.phase){
      card.appendChild($(`<div style="line-height:1.6">${H.n?`🏁 Completed so far: <b>${H.n}</b> quiz${H.n>1?'zes':''}.<br>`:''}Ready for a ${H.n?'new':''} 100-word quiz? The word list is built when you start.</div>`));
      const go=$(`<button class="primary" style="margin-top:14px">▶ Start ${H.n?'a new':'the'} 100-word quiz</button>`);
      go.onclick=()=>{ const HH=getHundred(lang); HH.list=buildMasteryList(lang,100); HH.phase=1; HH.tr=0;
        HH.rem=[...Array(10).keys()]; HH.n=HH.n+1; saveHundred(lang,HH); startHundredPass(); };
      card.appendChild(go);
    } else {
      const {size,count}=hSetInfo(H);
      const doneInSet=size-H.rem.length;
      card.appendChild($(`<div style="line-height:1.8">
        <span class="pill">${H.phase===1?'Round 1 — sets of 10':'Round 2 — sets of 20'}</span>
        <span class="pill">Set ${H.tr+1} / ${count}</span>
        <span class="pill">${H.rem.length} word${H.rem.length!==1?'s':''} left in this set${doneInSet?` (${doneInSet} done)`:''}</span></div>`));
      const go=$(`<button class="primary" style="margin-top:14px">▶ Continue — next pass (${H.rem.length} words)</button>`);
      go.onclick=startHundredPass;
      card.appendChild(go);
      const ab=$(`<button class="small" style="margin-top:14px;margin-left:10px">✕ Abandon this quiz</button>`);
      ab.onclick=()=>{ if(confirm('Abandon the current 100-word quiz? Progress on it is lost.')){
        const HH=getHundred(lang); HH.list=[]; HH.phase=0; HH.tr=0; HH.rem=[]; HH.n=Math.max(0,HH.n-1); saveHundred(lang,HH); render(); } };
      card.appendChild(ab);
    }
    app.appendChild(card);
    return;
  }
  if(hq.mode==='pass'){
    // ----- pass summary -----
    const card=$(`<div class="card" style="text-align:center"></div>`);
    card.appendChild($(`<h2 style="margin-top:0">${hq.headline}</h2>`));
    card.appendChild($(`<div style="line-height:1.7">${hq.detail}</div>`));
    const btn=$(`<button class="primary" style="margin-top:16px">${hq.nextLabel}</button>`);
    btn.onclick=()=>{ if(hq.finished){ state.hq=null; render(); } else startHundredPass(); };
    card.appendChild(btn);
    app.appendChild(card);
    setTimeout(()=>btn.focus(),50);
    return;
  }
  // ----- question -----
  const {size,count}=hSetInfo(H);
  const idx=hq.order[hq.pos];
  const w=H.list[idx];
  app.appendChild($(`<div class="topnav"><span class="backlink" id="quit">✕ Pause</span>
    <span style="color:var(--muted);font-size:.9rem">${d.flag} 100-Word · ${H.phase===1?'Sets of 10':'Sets of 20'} · Set ${H.tr+1}/${count}</span></div>`));
  app.querySelector('#quit').onclick=()=>{ state.hq=null; render(); };
  app.appendChild($(`<div class="qTop"><span>Word ${hq.pos+1} / ${hq.order.length}</span><span>✓ ${hq.nOk}</span></div>`));
  const bar=$(`<div class="barOuter"><div class="barInner"></div></div>`);
  bar.firstElementChild.style.width=(hq.pos/hq.order.length*100)+'%';
  app.appendChild(bar);
  const card=$(`<div class="card"></div>`);
  app.appendChild(card);
  card.appendChild($(`<div class="qWord">${nounPrompt(maskPrompt(w.e, w.t, lang), w.t)}</div>`));
  card.appendChild($(`<div class="qHint">Type the ${d.name} word${w.r?' · <span style="color:var(--warn)">review</span>':''} — accents optional; nouns need their article${CTRL_HINT[lang]||''}</div>`));
  const wrap=$(`<div style="max-width:560px;margin:0 auto;text-align:center"></div>`);
  const inp=$(`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;padding:14px 16px;font-size:1.1rem;border-radius:10px;border:2px solid var(--border);background:var(--card2);color:var(--text);outline:none" placeholder="Type here…">`);
  const accRow=$(`<div style="display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap"></div>`);
  (ACCENTS[lang]||[]).forEach(chr=>{
    const b=$(`<button class="small" style="min-width:38px;font-size:1.05rem">${chr}</button>`);
    const cb=comboFor(lang,chr); if(cb) b.title=cb;
    b.onclick=()=>{ const s=inp.selectionStart||inp.value.length; inp.value=inp.value.slice(0,s)+chr+inp.value.slice(inp.selectionEnd||s); inp.focus(); inp.setSelectionRange(s+1,s+1); };
    accRow.appendChild(b);
  });
  const go=$(`<button class="primary">Check</button>`);
  let checked=false;
  const doCheck=()=>{
    if(checked) return; checked=true;
    const ok=vocabAnswerOk(inp.value, w.t);
    const artMiss=!ok && answerMatches(inp.value, w.t);
    if(ok){
      hq.okIdx.push(idx); hq.nOk++;
      // credit immediately, so quitting mid-pass never loses a correct answer
      const HH=getHundred(lang);
      HH.rem=HH.rem.filter(i=>i!==idx);
      saveHundred(lang,HH);
    }
    inp.disabled=true; go.style.display='none';
    inp.style.borderColor= ok?'var(--good)':'var(--bad)';
    const fb=$(`<div class="feedback"></div>`);
    fb.appendChild($(`<div style="font-weight:600;color:${ok?'var(--good)':'var(--bad)'}">${ok?'✔ Correct!':artMiss?'✘ Right word, but the article (gender) is wrong or missing — it\'s “'+w.t+'”':'✘ It\'s “'+w.t+'”'}</div>`));
    fb.appendChild($(`<div class="expl">${w.t} = ${w.e}${pluralNote(lang, w.t)}</div>`));
    if(window.speechSynthesis) speak(w.t, d.ttsLang);
    const next=$(`<button class="primary" style="margin-top:12px">${hq.pos+1<hq.order.length?'Next →':'Finish pass'}</button>`);
    next.onclick=()=>{
      hq.pos++;
      if(hq.pos<hq.order.length){ render(); return; }
      // ----- pass finished: remove correct answers, advance set/round -----
      const HH=getHundred(lang);
      const okSet=new Set(hq.okIdx);
      HH.rem=HH.rem.filter(i=>!okSet.has(i));
      const info=hSetInfo(HH);
      const got=`You got <b>${hq.nOk} / ${hq.order.length}</b> this pass.`;
      let sum;
      if(HH.rem.length){
        sum={headline:'Pass complete', detail:`${got}<br>${HH.rem.length} word${HH.rem.length!==1?'s':''} to go in this set — they repeat until you clear them.`, nextLabel:`Next pass (${HH.rem.length} words) →`};
      } else {
        HH.tr++;
        if(HH.tr>=info.count){
          if(HH.phase===1){
            HH.phase=2; HH.tr=0; HH.rem=hSetIdx(HH);
            sum={headline:'🎉 Round 1 complete!', detail:`${got}<br>All 10 sets cleared. Round 2 combines them into <b>5 sets of 20</b> — same rules, right answers drop out each pass.`, nextLabel:'Start round 2 (20 words) →'};
          } else {
            HH.past.push(HH.list.map(x=>x.t));
            if(HH.past.length>10) HH.past=HH.past.slice(-10);
            HH.list=[]; HH.phase=0; HH.tr=0; HH.rem=[];
            sum={headline:'🏆 100-Word Quiz complete!', detail:`${got}<br>All 100 words cleared twice over. These words join the review pool for your next 100-word quiz.`, nextLabel:'Done', finished:true};
          }
        } else {
          HH.rem=hSetIdx(HH);
          sum={headline:`✅ Set ${HH.tr} cleared!`, detail:`${got}<br>On to set ${HH.tr+1} of ${info.count} (${info.size} ${HH.phase===2?'':'new '}words).`, nextLabel:`Start set ${HH.tr+1} →`};
        }
      }
      saveHundred(lang,HH);
      state.hq={mode:'pass', ...sum};
      render();
    };
    fb.appendChild(next);
    card.appendChild(fb);
    next.focus();
  };
  go.onclick=doCheck;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); e.__consumed=true; window.__enterTs=Date.now(); doCheck(); } });
  wrap.appendChild(inp); wrap.appendChild(accRow); wrap.appendChild(go);
  card.appendChild(wrap);
  setTimeout(()=>inp.focus(),50);
}

// ---------- 50-Word Climb (German & Italian) ----------
// A 50-word list built like the 100-Word Quiz (40% repeats / 60% new, shared
// word economy). A round starts with the working set (initially 5 words); if
// any are wrong, the round ends with a retake offer. Clear them all and new
// words are introduced one at a time — at least 3, then onward until the first
// mistake. Every round ends with Retake or Quit. Only words actually SHOWN
// count as tested (and as "used" for the 100-Word Quiz's pools).
const CLIMB_LANGS=['german','italian','dutch','spanish','japanese'];
// Up to 3 climbs can run side by side per language ("Climb 1/2/3"); the list
// builder keeps their word lists disjoint. Slot 0 uses the original storage
// key, so a pre-existing single climb becomes Climb 1 untouched.
const CLIMB_SLOTS=20;
function climbKey(lang,slot){ return 'lq_climb_'+lang+(slot?'#'+(slot+1):''); }
function curClimbSlot(){ return typeof state.climbSlot==='number' ? state.climbSlot : 0; }
function getClimb(lang, slot){
  if(slot===undefined) slot=curClimbSlot();
  try{ const o=JSON.parse(localStorage.getItem(climbKey(lang,slot))||'null')||{};
    return {list:o.list||[], used:o.used||0, tested:o.tested||[], past:o.past||[], n:o.n||0,
            removed:o.removed||[], lastMiss:o.lastMiss||[], rev:!!o.rev, comp:o.comp||[]};
  }catch(e){ return {list:[],used:0,tested:[],past:[],n:0,removed:[],lastMiss:[],rev:false,comp:[]}; }
}
function climbActive(L){ return L.used - L.removed.filter(i=>i<L.used).length; }
function saveClimb(lang,L,slot){
  if(slot===undefined) slot=curClimbSlot();
  localStorage.setItem(climbKey(lang,slot), JSON.stringify(L));
}
// The 🎯 Misses quiz: union of every climb's misses from its LAST completed
// round. Answering one correctly here clears it; the pool never grows by
// itself — only fresh misses in the climbs refill it.
function missPool(lang, sel){
  const seen=new Set(), pool=[];
  for(let s=0;s<CLIMB_SLOTS;s++){
    if(sel && !sel.has(s)) continue;
    for(const w of getClimb(lang,s).lastMiss){
      const k=stripArticle(foldTxt(w.t));
      if(!k||seen.has(k)) continue;
      seen.add(k); pool.push({t:w.t, e:w.e});
    }
  }
  return pool;
}
// Unique words ever shown across all of a language's climbs (current + past)
function climbTotalTested(lang){
  const s=new Set();
  for(const L of climbSlots(lang)){
    L.tested.forEach(t=>s.add(stripArticle(foldTxt(t))));
    L.past.flat().forEach(t=>s.add(stripArticle(foldTxt(t))));
  }
  return s.size;
}
// Reverse checking: ANY single English sense of the gloss is a correct answer
// ("Guten Tag = hello / good day" accepts either).
function englishAnswerOk(typed, gloss){
  const norm=s=>foldTxt(String(s).replace(/\(.*?\)/g,'')).replace(/^(to|a|an|the) /,'').trim();
  const t=norm(typed);
  if(!t) return false;
  return String(gloss).split(/[\/,;]/).some(s=>{
    const g=norm(s);
    return g && (g===t || g.replace(/\s+/g,'')===t.replace(/\s+/g,''));
  });
}
function missClear(lang, t){
  const k=stripArticle(foldTxt(t));
  for(let s=0;s<CLIMB_SLOTS;s++){
    const L=getClimb(lang,s);
    const nl=L.lastMiss.filter(w=>stripArticle(foldTxt(w.t))!==k);
    if(nl.length!==L.lastMiss.length){ L.lastMiss=nl; saveClimb(lang,L,s); }
  }
}
function climbSlots(lang){ return [...Array(CLIMB_SLOTS).keys()].map(s=>getClimb(lang,s)); }
// Refresh stored word snapshots from current course data (like migrateDaily),
// so gloss/article improvements reach climbs and 100-word quizzes already built.
function refreshStoredWords(lang, arr){
  const map=new Map();
  const add=it=>{ if(it&&it.t&&it.e){ const k=stripArticle(foldTxt(it.t)); if(k&&!map.has(k)) map.set(k,it); } };
  duoFlat(lang).forEach(add);
  DATA[lang].courses.filter(c=>!c.id.startsWith('duo_')).forEach(c=>c.units.forEach(u=>{ if(u.type==='vocab'&&u.items) u.items.forEach(add); }));
  customUnitsFor(lang).forEach(u=>(u.items||[]).forEach(add));
  let ch=false;
  for(const w of arr){
    const cur=map.get(stripArticle(foldTxt(w.t)));
    if(!cur) continue;
    if(cur.t!==w.t){ w.t=cur.t; ch=true; }
    if(cur.e!==w.e){ w.e=cur.e; ch=true; }
  }
  return ch;
}
function migrateMastery(lang){
  const H=getHundred(lang);
  if(H.list.length && refreshStoredWords(lang,H.list)) saveHundred(lang,H);
  for(let s=0;s<CLIMB_SLOTS;s++){
    const L=getClimb(lang,s);
    if(!L.list.length) continue;
    const before=JSON.stringify(L.tested);
    let ch=refreshStoredWords(lang,L.list);
    if(L.lastMiss.length) ch=refreshStoredWords(lang,L.lastMiss)||ch;
    const m2=new Map(L.list.map(x=>[stripArticle(foldTxt(x.t)),x.t]));
    L.tested=[...new Set(L.tested.map(t=>m2.get(stripArticle(foldTxt(t)))||t))];
    if(ch||JSON.stringify(L.tested)!==before) saveClimb(lang,L,s);
  }
  climbDedupe(lang);
}
// Safety net: no two climbs may hold the same word. The list builder already
// guarantees this at build time; this repairs any duplicate by swapping it
// for a fresh word no quiz is using.
function climbDedupe(lang){
  const key=t=>stripArticle(foldTxt(t));
  const slots=[...Array(CLIMB_SLOTS).keys()].map(s=>getClimb(lang,s));
  const usedAll=new Set();
  for(const L of slots) L.list.forEach(x=>usedAll.add(key(x.t)));
  const H=getHundred(lang);
  H.list.forEach(x=>usedAll.add(key(x.t)));
  H.past.flat().forEach(t=>usedAll.add(key(t)));
  for(const L of slots){ L.past.flat().forEach(t=>usedAll.add(key(t))); L.tested.forEach(t=>usedAll.add(key(t))); }
  Object.keys(getDaily(lang).stats).forEach(t=>usedAll.add(key(t)));
  const learned=getLearned(lang);
  const pool=duoFlat(lang).filter(it=>it&&it.t&&it.e&&!learned.has(it.t));
  const seen=new Set(); let pi=0;
  for(let s=0;s<CLIMB_SLOTS;s++){
    const L=slots[s]; let ch=false;
    for(let i=0;i<L.list.length;i++){
      const k=key(L.list[i].t);
      if(!seen.has(k)){ seen.add(k); continue; }
      while(pi<pool.length && (usedAll.has(key(pool[pi].t))||seen.has(key(pool[pi].t)))) pi++;
      if(pi>=pool.length) return;
      const nw=pool[pi++];
      L.list[i]={t:nw.t, e:nw.e};
      seen.add(key(nw.t)); usedAll.add(key(nw.t));
      ch=true;
    }
    if(ch) saveClimb(lang,L,s);
  }
}
function climbMarkTested(lang, t){
  const L=getClimb(lang);
  if(!L.tested.includes(t)){ L.tested.push(t); saveClimb(lang,L); }
}
function startClimbRound(){
  const lang=state.climbLang;
  let L=getClimb(lang);
  if(!L.used){ state.lq=null; render(); return; }
  let queue=shuffle([...Array(L.used).keys()].filter(i=>!L.removed.includes(i)));
  if(!queue.length){                      // every set word removed: deal fresh ones
    if(L.used>=50){ state.lq=null; render(); return; }
    L.used++; saveClimb(lang,L);
    queue=[L.used-1];
  }
  state.lq={mode:'q', phase:'set', queue, pos:0, mistakes:0, nOk:0, added:0, extIdx:-1, wrong:[]};
  render();
}
// practice round over ONLY this climb's last-round misses (does not climb)
function startClimbMissRound(){
  const lang=state.climbLang, L=getClimb(lang);
  if(!L.lastMiss.length){ state.lq=null; render(); return; }
  state.lq={mode:'q', phase:'missonly', items:shuffle([...L.lastMiss]), queue:[], pos:0,
            mistakes:0, nOk:0, added:0, extIdx:-1, wrong:[]};
  render();
}
function makeClimbSlotRow(lang, current){
  const row=$(`<div class="row" style="margin-bottom:14px"></div>`);
  for(let s=0;s<CLIMB_SLOTS;s++){
    const Ls=getClimb(lang,s);
    const lbl=Ls.used?`${Ls.used}/50${Ls.lastMiss.length?` · 🎯${Ls.lastMiss.length}`:''}`:(Ls.n?`${Ls.n} done`:'empty');
    const b=$(`<button style="flex:1;min-width:92px;padding:9px 6px${s===current?';border:2px solid var(--accent)':''}">Climb ${s+1}${Ls.rev?' 🔄':''}<br><span class="pill">${lbl}</span></button>`);
    b.onclick=()=>{ state.climbSlot=s; state.lq=null; render(); };
    row.appendChild(b);
  }
  const mp=missPool(lang);
  const mb=$(`<button style="flex:1;min-width:92px;padding:9px 6px${current==='miss'?';border:2px solid var(--accent)':''}">🎯 Misses<br><span class="pill">${mp.length} word${mp.length!==1?'s':''}</span></button>`);
  mb.onclick=()=>{ state.climbSlot='miss'; state.lq=null; render(); };
  row.appendChild(mb);
  return row;
}
function renderClimb(){
  const lang=state.climbLang, d=DATA[lang];
  if(!state.lq) migrateMastery(lang);
  if(state.climbSlot==='miss'){ renderClimbMisses(lang, DATA[lang]); return; }
  const L=getClimb(lang);
  const lq=state.lq;
  if(!lq){
    // ----- overview -----
    app.appendChild($(`<span class="backlink" id="back">← Home</span>`));
    app.querySelector('#back').onclick=()=>{ state.screen='home'; render(); };
    app.appendChild($(`<h1>${d.flag} 🪜 50-Word Climb</h1>`));
    app.appendChild($(`<div class="sub">Start with 5 words. Answer them all correctly and the quiz keeps dealing new words — at least 3, then onward until your first mistake. Miss any and you can retake the set. Climb until all 50 are cleared in a single run. 40% review words, 60% new; words tested here also count as used for the 100-Word Quiz. Up to ${CLIMB_SLOTS} climbs can run side by side — their word lists never overlap, so switch whenever you lose momentum.</div>`));
    app.appendChild(makeClimbSlotRow(lang, curClimbSlot()));
    {
      const nAct=[...Array(CLIMB_SLOTS).keys()].filter(s=>getClimb(lang,s).list.length).length;
      if(nAct>=2){
        const sh=$(`<button class="small" style="margin-bottom:14px">🔀 Shuffle words across all ${nAct} climbs</button>`);
        sh.onclick=()=>{ if(confirm(`Redistribute the words of all ${nAct} active climbs randomly among them? Progress counts, tested words, removals and misses travel with their words.`)){
          shuffleClimbs(lang); state.lq=null; render(); } };
        app.appendChild(sh);
      }
    }
    const card=$(`<div class="card"></div>`);
    if(!L.used){
      card.appendChild($(`<div style="line-height:1.6">${L.n?`🏁 Completed so far: <b>${L.n}</b>.<br>`:''}${climbTotalTested(lang)?`<span class="pill">${climbTotalTested(lang)} tested across all climbs</span><br>`:''}Ready for a ${L.n?'new':''} climb? The 50-word list is built when you start.</div>`));
      const go=$(`<button class="primary" style="margin-top:14px">▶ Start ${L.n?'a new':'the'} climb</button>`);
      go.onclick=()=>{ const LL=getClimb(lang); LL.list=buildMasteryList(lang,50); LL.used=5; LL.tested=[];
        saveClimb(lang,LL); state.climbLang=lang; startClimbRound(); };
      card.appendChild(go);
    } else {
      card.appendChild($(`<div style="line-height:1.8">
        <span class="pill">Climbed to ${L.used} / 50</span>
        <span class="pill">${L.tested.length} word${L.tested.length!==1?'s':''} tested in this climb</span>
        ${L.removed.length?`<span class="pill">${L.removed.length} removed</span>`:''}
        <span class="pill">${climbTotalTested(lang)} tested across all climbs</span></div>`));
      const go=$(`<button class="primary" style="margin-top:14px">▶ Continue — run the set (${climbActive(L)} words)</button>`);
      go.onclick=startClimbRound;
      card.appendChild(go);
      const rv=$(`<button class="small" style="margin-top:14px;margin-left:10px">${L.rev?'🔄 Reverse mode ON — type English':'➡ Normal mode — type '+d.name} (click to switch)</button>`);
      rv.onclick=()=>{ const LL=getClimb(lang); LL.rev=!LL.rev; saveClimb(lang,LL); render(); };
      card.appendChild(rv);
      if(L.removed.length){
        const rc=$(`<div style="margin-top:16px"></div>`);
        rc.appendChild($(`<div style="color:var(--muted);font-size:.9rem;margin-bottom:6px">Removed words — click one to put it back in the climb:</div>`));
        const row=$(`<div style="display:flex;gap:6px;flex-wrap:wrap"></div>`);
        for(const i of [...L.removed].sort((a,b)=>a-b)){
          const w=L.list[i]; if(!w) continue;
          const b=$(`<button class="small">↩ ${w.t}</button>`);
          b.title=w.e;
          b.onclick=()=>{ const LL=getClimb(lang); LL.removed=LL.removed.filter(x=>x!==i); saveClimb(lang,LL); render(); };
          row.appendChild(b);
        }
        if(L.removed.length>1){
          const all=$(`<button class="small" style="border-color:var(--accent)">↩ Re-add all (${L.removed.length})</button>`);
          all.onclick=()=>{ const LL=getClimb(lang); LL.removed=[]; saveClimb(lang,LL); render(); };
          row.appendChild(all);
        }
        rc.appendChild(row);
        card.appendChild(rc);
      }
      const ab=$(`<button class="small" style="margin-top:14px;margin-left:10px">✕ Abandon this climb</button>`);
      ab.onclick=()=>{ if(confirm('Abandon this climb? Words already tested stay counted as used; the rest are released.')){
        const LL=getClimb(lang);
        if(LL.tested.length){ LL.past.push([...LL.tested]); if(LL.past.length>10) LL.past=LL.past.slice(-10); }
        LL.list=[]; LL.used=0; LL.tested=[]; LL.removed=[]; LL.lastMiss=[]; saveClimb(lang,LL); render(); } };
      card.appendChild(ab);
    }
    app.appendChild(card);
    return;
  }
  if(lq.mode==='end'){
    // ----- round end: retake / quit (or completion) -----
    const card=$(`<div class="card" style="text-align:center"></div>`);
    card.appendChild($(`<h2 style="margin-top:0">${lq.headline}</h2>`));
    card.appendChild($(`<div style="line-height:1.7">${lq.detail}</div>`));
    if(lq.complete){
      const btn=$(`<button class="primary" style="margin-top:16px">Done</button>`);
      btn.onclick=()=>{ state.lq=null; render(); };
      card.appendChild(btn);
      setTimeout(()=>btn.focus(),50);
    } else {
      const LNow=getClimb(lang);
      const room=Math.max(0, 50-LNow.used);
      const addRow=$(`<div style="margin-top:16px">Add <select id="addN" style="padding:6px 10px;border-radius:8px;border:2px solid var(--border);background:var(--card2);color:var(--text)"></select> new word${room?'s':''} for the next pass</div>`);
      const sel=addRow.querySelector('#addN');
      for(let i=0;i<=Math.min(10,room);i++) sel.appendChild($(`<option value="${i}">${i}</option>`));
      const rt=$(`<button class="primary" style="margin-top:16px">🔁 Retake — ${climbActive(LNow)} words</button>`);
      sel.onchange=()=>{ rt.textContent=`🔁 Retake — ${climbActive(LNow)+ +sel.value} words`; };
      rt.onclick=()=>{
        const k=+sel.value;
        if(k>0){ const LL=getClimb(lang); LL.used=Math.min(50, LL.used+k); saveClimb(lang,LL); }
        startClimbRound();
      };
      const lm=LNow.lastMiss.length;
      let mo=null;
      if(lm){
        mo=$(`<button class="primary" style="margin-top:16px;margin-left:10px;background:var(--card2);color:var(--text);border:2px solid var(--accent)">🎯 Only the ${lm} missed</button>`);
        mo.onclick=startClimbMissRound;
      }
      const sw=$(`<button class="small" style="margin-top:16px;margin-left:10px">🪜 Other climbs</button>`);
      sw.onclick=()=>{ state.lq=null; render(); };
      const qt=$(`<button class="small" style="margin-top:16px;margin-left:10px">✕ Quit for now</button>`);
      qt.onclick=()=>{ state.lq=null; state.screen='home'; render(); };
      card.appendChild(addRow);
      if(LNow.removed.length){
        const ra=$(`<button class="small" style="margin-top:10px">↩ Re-add the ${LNow.removed.length} removed word${LNow.removed.length!==1?'s':''}</button>`);
        ra.onclick=()=>{ const LL=getClimb(lang); LL.removed=[]; saveClimb(lang,LL); render(); };
        card.appendChild($(`<div></div>`)).appendChild(ra);
      }
      card.appendChild(rt); if(mo) card.appendChild(mo);
      card.appendChild(sw); card.appendChild(qt);
      setTimeout(()=>rt.focus(),50);
    }
    app.appendChild(card);
    return;
  }
  // ----- question -----
  const isMiss = lq.phase==='missonly';
  const rev = !!L.rev;                      // 🔄 reverse mode: show target, type English
  const idx = isMiss ? -1 : (lq.phase==='set' ? lq.queue[lq.pos] : lq.extIdx);
  const w = isMiss ? lq.items[lq.pos] : L.list[idx];
  const posLabel = isMiss ? `🎯 Missed ${lq.pos+1} / ${lq.items.length}`
                 : lq.phase==='set' ? `Word ${lq.pos+1} / ${lq.queue.length}` : `🆕 New word +${lq.added+1}`;
  app.appendChild($(`<div class="topnav"><span class="backlink" id="quit">✕ Pause</span>
    <span style="color:var(--muted);font-size:.9rem">${d.flag} Climb ${(state.climbSlot||0)+1} · at ${L.used}/50</span></div>`));
  app.querySelector('#quit').onclick=()=>{ state.lq=null; render(); };
  app.appendChild($(`<div class="qTop"><span>${posLabel}</span><span>✓ ${lq.nOk}</span></div>`));
  const bar=$(`<div class="barOuter"><div class="barInner"></div></div>`);
  bar.firstElementChild.style.width=((isMiss? lq.pos/lq.items.length : lq.phase==='set'? lq.pos/lq.queue.length : 1)*100)+'%';
  app.appendChild(bar);
  const card=$(`<div class="card"></div>`);
  app.appendChild(card);
  card.appendChild($(`<div class="qWord">${rev ? jpDisp(w.t) : nounPrompt(maskPrompt(w.e, w.t, lang), w.t)}</div>`));
  card.appendChild($(`<div class="qHint">${rev ? 'Type the English — any one translation counts' : lang==='japanese' ? `Type the Japanese word in romaji — it becomes hiragana${w.r?' · <span style="color:var(--warn)">review</span>':''}${lq.phase==='ext'?' · <span style="color:var(--good)">keep the streak!</span>':''}` : `Type the ${d.name} word${w.r?' · <span style="color:var(--warn)">review</span>':''}${lq.phase==='ext'?' · <span style="color:var(--good)">keep the streak!</span>':''} — accents optional; nouns need their article${CTRL_HINT[lang]||''}`}</div>`));
  if(rev && window.speechSynthesis){
    const sp=$(`<button class="speakBtn" title="Play audio">🔊</button>`);
    sp.onclick=()=>speak(w.t, d.ttsLang);
    card.appendChild(sp);
    setTimeout(()=>speak(w.t, d.ttsLang), 250);
  }
  const wrap=$(`<div style="max-width:560px;margin:0 auto;text-align:center"></div>`);
  const inp=$(`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;padding:14px 16px;font-size:1.1rem;border-radius:10px;border:2px solid var(--border);background:var(--card2);color:var(--text);outline:none" placeholder="Type here…">`);
  if(!rev) jpBind(inp, lang);
  const accRow=$(`<div style="display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap"></div>`);
  (rev ? [] : ACCENTS[lang]||[]).forEach(chr=>{
    const b=$(`<button class="small" style="min-width:38px;font-size:1.05rem">${chr}</button>`);
    const cb=comboFor(lang,chr); if(cb) b.title=cb;
    b.onclick=()=>{ const s=inp.selectionStart||inp.value.length; inp.value=inp.value.slice(0,s)+chr+inp.value.slice(inp.selectionEnd||s); inp.focus(); inp.setSelectionRange(s+1,s+1); };
    accRow.appendChild(b);
  });
  const go=$(`<button class="primary">Check</button>`);
  let checked=false;
  const doCheck=()=>{
    if(checked) return; checked=true;
    climbMarkTested(lang, w.t);
    const ok = rev ? englishAnswerOk(inp.value, w.e) : vocabAnswerOk(inp.value, w.t);
    const artMiss = !rev && !ok && answerMatches(inp.value, w.t);
    if(ok) lq.nOk++;
    else { lq.mistakes++; if(!lq.wrong.some(x=>x.t===w.t)) lq.wrong.push({t:w.t, e:w.e}); }
    inp.disabled=true; go.style.display='none';
    inp.style.borderColor= ok?'var(--good)':'var(--bad)';
    const fb=$(`<div class="feedback"></div>`);
    fb.appendChild($(`<div style="font-weight:600;color:${ok?'var(--good)':'var(--bad)'}">${ok?'✔ Correct!':rev?'✘ It means “'+w.e+'”':artMiss?'✘ Right word, but the article (gender) is wrong or missing — it\'s “'+w.t+'”':'✘ It\'s “'+jpDisp(w.t)+'”'}</div>`));
    fb.appendChild($(`<div class="expl">${jpDisp(w.t)} = ${w.e}${pluralNote(lang, w.t)}</div>`));
    if(!rev && window.speechSynthesis) speak(w.t, d.ttsLang);
    const endRound=()=>{
      const LL=getClimb(lang);
      LL.lastMiss=[...lq.wrong];           // feeds the 🎯 Misses quiz
      saveClimb(lang,LL);
      const asked=(lq.phase==='set'? lq.pos+1 : lq.queue.length+lq.added+1);
      const got=`You got <b>${lq.nOk} / ${asked}</b> this round.`;
      if(lq.mistakes===0 && LL.used>=50){
        LL.past.push([...LL.tested]); if(LL.past.length>10) LL.past=LL.past.slice(-10);
        // completed sets count as mastered (past alone can't — abandons land there too)
        LL.comp=(LL.comp||[]).concat([[...LL.tested]]);
        LL.list=[]; LL.used=0; LL.tested=[]; LL.removed=[]; LL.lastMiss=[]; LL.n=LL.n+1; saveClimb(lang,LL);
        state.lq={mode:'end', complete:true, headline:'🏆 Climb complete!',
          detail:`${got}<br>All 50 words cleared in a single run. They join the review pool for future quizzes.`};
      } else if(lq.mistakes===0){
        state.lq={mode:'end', headline:'✅ Perfect round!',
          detail:`${got}<br>Climbed to <b>${LL.used}</b> of 50 — the new words join your set.`};
      } else {
        const extMiss = lq.phase==='ext' && !ok;   // previous set was fully cleared
        const joined = lq.added + (extMiss?1:0);
        state.lq={mode:'end', headline:'Round over',
          detail:`${got}${joined?`<br>+${joined} new word${joined!==1?'s':''} tested and added to the set.`:''}${extMiss&&LL.used>joined+lq.queue.length?`<br>+3 fresh words queued for the next round.`:''}<br>The set stands at <b>${climbActive(LL)}</b> word${climbActive(LL)!==1?'s':''} — clear them all in one run to climb.`};
      }
      render();
    };
    const isLastOfSet = lq.phase==='set' && lq.pos+1>=lq.queue.length;
    let label='Next →';
    if(isMiss){ if(lq.pos+1>=lq.items.length) label='Finish round'; }
    else if(lq.phase==='ext' && !ok) label='Finish round';
    else if(isLastOfSet && lq.mistakes>0) label='Finish round';
    const next=$(`<button class="primary" style="margin-top:12px">${label}</button>`);
    next.onclick=()=>{
      if(isMiss){
        lq.pos++;
        if(lq.pos<lq.items.length){ render(); return; }
        const LL=getClimb(lang);
        LL.lastMiss=[...lq.wrong]; saveClimb(lang,LL);   // the still-missed subset
        state.lq={mode:'end',
          headline: lq.wrong.length ? '🎯 Missed-words round done' : '🎉 All previous misses cleared!',
          detail:`You got <b>${lq.nOk} / ${lq.items.length}</b>.${lq.wrong.length?`<br><b>${lq.wrong.length}</b> still missed.`:''}<br>This was practice — climbing still needs the full set in one run.`};
        render(); return;
      }
      if(lq.phase==='set'){
        lq.pos++;
        if(lq.pos<lq.queue.length){ render(); return; }
        if(lq.mistakes>0){ endRound(); return; }
        const LL=getClimb(lang);
        if(LL.used>=50){ endRound(); return; }       // full board cleared
        LL.used++; saveClimb(lang,LL);               // introduce first new word
        lq.phase='ext'; lq.extIdx=LL.used-1;
        render(); return;
      }
      // ext phase
      if(!ok){
        // the old set was fully cleared before this miss on a NEW word:
        // queue 3 additional not-yet-seen words into the next round's set
        const LL=getClimb(lang);
        LL.used=Math.min(50, LL.used+3); saveClimb(lang,LL);
        endRound(); return;
      }
      lq.added++;
      const LL=getClimb(lang);
      if(LL.used>=50){ endRound(); return; }         // reached the top, all correct
      LL.used++; saveClimb(lang,LL);
      lq.extIdx=LL.used-1;
      render();
    };
    fb.appendChild(next);
    if(ok){
      // "I know this one" — drop the word from this climb and move on
      const rm=$(`<button class="small" style="margin-top:12px;margin-left:10px">🗑 Remove word & continue</button>`);
      rm.onclick=()=>{
        const LL=getClimb(lang);
        const ri = isMiss ? LL.list.findIndex(x=>x.t===w.t) : idx;
        if(ri>=0 && !LL.removed.includes(ri)) LL.removed.push(ri);
        if(isMiss) LL.lastMiss=LL.lastMiss.filter(x=>x.t!==w.t);
        saveClimb(lang,LL);
        next.onclick();
      };
      fb.appendChild(rm);
    }
    card.appendChild(fb);
    next.focus();
  };
  go.onclick=doCheck;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); e.__consumed=true; window.__enterTs=Date.now(); doCheck(); } });
  wrap.appendChild(inp); wrap.appendChild(accRow); wrap.appendChild(go);
  card.appendChild(wrap);
  setTimeout(()=>inp.focus(),50);
}

// 🔀 Shuffle: redistribute the words of ALL active climbs across those same
// climbs. Each climb keeps its size, progress count and reverse flag; each
// word travels with its status (tested / removed / missed). Lists stay
// disjoint because the pools are partitioned.
function shuffleClimbs(lang){
  const key=t=>stripArticle(foldTxt(t));
  const act=[];
  for(let s=0;s<CLIMB_SLOTS;s++){
    const L=getClimb(lang,s);
    if(L.list.length) act.push([s,L]);
  }
  if(act.length<2) return false;
  const intro=[], unseen=[];
  for(const [s,L] of act){
    const testedSet=new Set(L.tested.map(key));
    const missSet=new Set(L.lastMiss.map(w=>key(w.t)));
    const remSet=new Set(L.removed);
    L.list.forEach((w,i)=>{
      const rec={t:w.t, e:w.e, r:w.r, tested:testedSet.has(key(w.t)), removed:remSet.has(i), missed:missSet.has(key(w.t))};
      (i<L.used?intro:unseen).push(rec);
    });
  }
  const si=shuffle(intro), su=shuffle(unseen);
  let pi=0, pu=0;
  for(const [s,L] of act){
    const nIntro=L.used, nUnseen=L.list.length-L.used;
    const mine=[...si.slice(pi,pi+nIntro), ...su.slice(pu,pu+nUnseen)];
    pi+=nIntro; pu+=nUnseen;
    L.list=mine.map(w=>w.r?{t:w.t,e:w.e,r:1}:{t:w.t,e:w.e});
    L.tested=mine.filter(w=>w.tested).map(w=>w.t);
    L.removed=mine.map((w,i)=>w.removed?i:-1).filter(i=>i>=0);
    L.lastMiss=mine.filter(w=>w.missed).map(w=>({t:w.t,e:w.e}));
    saveClimb(lang,L,s);
  }
  return true;
}

// 🎯 Misses quiz view: repeats only the collected last-round misses of the
// five climbs; correct answers clear a word everywhere; never deals new words.
function renderClimbMisses(lang, d){
  const ms=state.lq;
  if(!ms){
    app.appendChild($(`<span class="backlink" id="back">← Home</span>`));
    app.querySelector('#back').onclick=()=>{ state.screen='home'; render(); };
    app.appendChild($(`<h1>${d.flag} 🎯 Missed Words</h1>`));
    app.appendChild($(`<div class="sub">Every word you missed in the <b>last round</b> of each climb lands here. Answer one correctly and it leaves the list — this quiz only repeats your misses, it never adds new words. Pick which climbs to draw from below.</div>`));
    app.appendChild(makeClimbSlotRow(lang,'miss'));
    // which climbs to include (chips; default = all with misses)
    const withMiss=[...Array(CLIMB_SLOTS).keys()].filter(s=>getClimb(lang,s).lastMiss.length);
    if(state.missSelLang!==lang || !(state.missSel instanceof Set)){ state.missSel=new Set(withMiss); state.missSelLang=lang; }
    state.missSel=new Set([...state.missSel].filter(s=>withMiss.includes(s)));
    const sel=state.missSel;
    const card=$(`<div class="card"></div>`);
    if(!withMiss.length){
      card.appendChild($(`<div style="line-height:1.6">🎉 Nothing here — no words were missed in your climbs' latest rounds.</div>`));
    } else {
      if(withMiss.length>1){
        const chipRow=$(`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>`);
        for(const s of withMiss){
          const n=getClimb(lang,s).lastMiss.length;
          const c=$(`<button class="small" style="${sel.has(s)?'border:2px solid var(--accent);color:var(--text)':'opacity:.55'}">Climb ${s+1} · ${n}</button>`);
          c.onclick=()=>{ sel.has(s)?sel.delete(s):sel.add(s); render(); };
          chipRow.appendChild(c);
        }
        const all=$(`<button class="small">All</button>`);
        all.onclick=()=>{ state.missSel=new Set(withMiss); render(); };
        const none=$(`<button class="small">None</button>`);
        none.onclick=()=>{ state.missSel=new Set(); render(); };
        chipRow.appendChild(all); chipRow.appendChild(none);
        card.appendChild(chipRow);
      }
      const pool=missPool(lang, sel);
      card.appendChild($(`<div style="line-height:1.8"><span class="pill">${pool.length} missed word${pool.length!==1?'s':''} selected</span></div>`));
      if(pool.length){
        const go=$(`<button class="primary" style="margin-top:14px">▶ Quiz the missed words (${pool.length})</button>`);
        go.onclick=()=>{ state.lq={mode:'q', miss:true, items:shuffle(missPool(lang, sel)), pos:0, nOk:0}; render(); };
        card.appendChild(go);
      } else {
        card.appendChild($(`<div style="margin-top:10px;color:var(--muted)">Select at least one climb.</div>`));
      }
    }
    app.appendChild(card);
    return;
  }
  if(ms.end){
    const remaining=missPool(lang, state.missSel instanceof Set ? state.missSel : undefined).length;
    const card=$(`<div class="card" style="text-align:center"></div>`);
    card.appendChild($(`<h2 style="margin-top:0">${remaining?'Round done':'🎉 All misses cleared!'}</h2>`));
    card.appendChild($(`<div style="line-height:1.7">You got <b>${ms.nOk} / ${ms.items.length}</b>.${remaining?`<br><b>${remaining}</b> word${remaining!==1?'s':''} still missed.`:''}</div>`));
    if(remaining){
      const rt=$(`<button class="primary" style="margin-top:16px">🔁 Retake the remaining ${remaining}</button>`);
      rt.onclick=()=>{ state.lq={mode:'q', miss:true, items:shuffle(missPool(lang, state.missSel instanceof Set ? state.missSel : undefined)), pos:0, nOk:0}; render(); };
      card.appendChild(rt);
    }
    const bk=$(`<button class="small" style="margin-top:16px;margin-left:10px">← Back</button>`);
    bk.onclick=()=>{ state.lq=null; render(); };
    card.appendChild(bk);
    app.appendChild(card);
    setTimeout(()=>{ (card.querySelector('.primary')||bk).focus(); },50);
    return;
  }
  ipQuestion({ lang, header:`🎯 Missed words`, prompt:`Type the ${d.name} word — accents optional; nouns need their article`,
    count:ms.items.length, pos:ms.pos, nOk:ms.nOk, item:ms.items[ms.pos],
    onQuit:()=>{ state.lq=null; render(); },
    onAnswered:ok=>{
      if(ok){ ms.nOk++; missClear(lang, ms.items[ms.pos].t); }
      ms.pos++;
      if(ms.pos<ms.items.length){ render(); return; }
      ms.end=true; render();
    }});
}

// ---------- Idioms Test & Useful Phrases (German/Italian/Dutch) ----------
// Idioms: typed, worked through in sets of 10; the reveal shows meaning,
// literal translation and a usage hint. Phrases: pick a topic (restaurant,
// directions, …), get 10 typed phrases from it.
const IP_LANGS=['german','italian','dutch','spanish'];
function idiomList(lang){ return (window.QUIZ_IDIOMS||{})[lang]||[]; }
function phraseTopics(lang){ return (window.QUIZ_PHRASES||{})[lang]||[]; }
function getIdiomProg(lang){ try{ const o=JSON.parse(localStorage.getItem('lq_idiomtest_'+lang)||'{}'); return {next:o.next||0, best:o.best||{}}; }catch(e){ return {next:0,best:{}}; } }
function saveIdiomProg(lang,p){ localStorage.setItem('lq_idiomtest_'+lang, JSON.stringify(p)); }
function getPhraseProg(lang){ try{ return JSON.parse(localStorage.getItem('lq_phrases_'+lang)||'{}'); }catch(e){ return {}; } }
function savePhraseProg(lang,p){ localStorage.setItem('lq_phrases_'+lang, JSON.stringify(p)); }

// shared typed-question card for both quizzes; cfg={lang, header, count, item,
// pos, extraFeedback(item)->html, onAnswered(ok)}
function ipQuestion(cfg){
  const d=DATA[cfg.lang];
  app.appendChild($(`<div class="topnav"><span class="backlink" id="quit">✕ Quit</span>
    <span style="color:var(--muted);font-size:.9rem">${d.flag} ${cfg.header}</span></div>`));
  app.querySelector('#quit').onclick=cfg.onQuit;
  app.appendChild($(`<div class="qTop"><span>${cfg.pos+1} / ${cfg.count}</span><span>✓ ${cfg.nOk}</span></div>`));
  const bar=$(`<div class="barOuter"><div class="barInner"></div></div>`);
  bar.firstElementChild.style.width=(cfg.pos/cfg.count*100)+'%';
  app.appendChild(bar);
  const card=$(`<div class="card"></div>`);
  app.appendChild(card);
  const w=cfg.item;
  card.appendChild($(`<div class="qWord" style="font-size:1.5rem">${w.e}</div>`));
  card.appendChild($(`<div class="qHint">${cfg.prompt}${CTRL_HINT[cfg.lang]||''}</div>`));
  const wrap=$(`<div style="max-width:640px;margin:0 auto;text-align:center"></div>`);
  const inp=$(`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;padding:14px 16px;font-size:1.1rem;border-radius:10px;border:2px solid var(--border);background:var(--card2);color:var(--text);outline:none" placeholder="Type here…">`);
  jpBind(inp, cfg.lang);
  const accRow=$(`<div style="display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap"></div>`);
  (ACCENTS[cfg.lang]||[]).forEach(chr=>{
    const b=$(`<button class="small" style="min-width:38px;font-size:1.05rem">${chr}</button>`);
    const cb=comboFor(cfg.lang,chr); if(cb) b.title=cb;
    b.onclick=()=>{ const s=inp.selectionStart||inp.value.length; inp.value=inp.value.slice(0,s)+chr+inp.value.slice(inp.selectionEnd||s); inp.focus(); inp.setSelectionRange(s+1,s+1); };
    accRow.appendChild(b);
  });
  const go=$(`<button class="primary">Check</button>`);
  let checked=false;
  const doCheck=()=>{
    if(checked) return; checked=true;
    const ok=vocabAnswerOk(inp.value, w.t);
    inp.disabled=true; go.style.display='none';
    inp.style.borderColor= ok?'var(--good)':'var(--bad)';
    const fb=$(`<div class="feedback"></div>`);
    fb.appendChild($(`<div style="font-weight:600;color:${ok?'var(--good)':'var(--bad)'}">${ok?'✔ Correct!':'✘ It\'s “'+jpDisp(w.t)+'”'}</div>`));
    fb.appendChild($(`<div class="expl" style="font-size:1.05rem">${jpDisp(w.t)} = ${w.e}</div>`));
    if(cfg.extraFeedback) fb.appendChild($(`<div>${cfg.extraFeedback(w)}</div>`));
    if(window.speechSynthesis) speak(w.t, d.ttsLang);
    const next=$(`<button class="primary" style="margin-top:12px">${cfg.pos+1<cfg.count?'Next →':'Finish'}</button>`);
    next.onclick=()=>cfg.onAnswered(ok);
    fb.appendChild(next);
    card.appendChild(fb);
    next.focus();
  };
  go.onclick=doCheck;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); e.__consumed=true; window.__enterTs=Date.now(); doCheck(); } });
  wrap.appendChild(inp); wrap.appendChild(accRow); wrap.appendChild(go);
  card.appendChild(wrap);
  setTimeout(()=>inp.focus(),50);
}

function renderIdioms(){
  const lang=state.ipLang, d=DATA[lang];
  const list=idiomList(lang);
  const sets=Math.ceil(list.length/10);
  const p=getIdiomProg(lang);
  const iq=state.iq;
  if(!iq){
    app.appendChild($(`<span class="backlink" id="back">← Home</span>`));
    app.querySelector('#back').onclick=()=>{ state.screen='home'; render(); };
    app.appendChild($(`<h1>${d.flag} 🗣 Idioms Test</h1>`));
    app.appendChild($(`<div class="sub"><b>${list.length} idioms</b> in ${sets} sets of 10. Type the ${d.name} idiom for the English meaning; the answer shows the literal translation and a usage hint. Finish a set and move on to the next.</div>`));
    const card=$(`<div class="card"></div>`);
    const cur=Math.min(p.next, sets-1);
    const go=$(`<button class="primary">▶ ${p.next>=sets?'All sets done — replay set 1':'Start set '+(cur+1)+' of '+sets}</button>`);
    go.onclick=()=>{ const set=p.next>=sets?0:cur; startIdiomSet(set); };
    card.appendChild(go);
    const grid=$(`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"></div>`);
    for(let i=0;i<sets;i++){
      const n=Math.min(10, list.length-i*10);
      const b=$(`<button class="small">Set ${i+1}${p.best[i]!=null?` · ${p.best[i]}/${n}`:''}</button>`);
      if(p.best[i]===n) b.style.color='var(--good)';
      b.onclick=()=>startIdiomSet(i);
      grid.appendChild(b);
    }
    card.appendChild(grid);
    app.appendChild(card);
    return;
  }
  if(iq.end){
    const n=iq.items.length;
    const card=$(`<div class="card" style="text-align:center"></div>`);
    card.appendChild($(`<h2 style="margin-top:0">${iq.nOk===n?'🎉 Set '+(iq.set+1)+' — perfect!':'Set '+(iq.set+1)+' done'}</h2>`));
    card.appendChild($(`<div style="line-height:1.7">You got <b>${iq.nOk} / ${n}</b>.</div>`));
    if(iq.set+1<sets){
      const nx=$(`<button class="primary" style="margin-top:16px">Next set (${iq.set+2} of ${sets}) →</button>`);
      nx.onclick=()=>startIdiomSet(iq.set+1);
      card.appendChild(nx);
    } else card.appendChild($(`<div style="margin-top:12px;color:var(--good)">🏆 That was the last set!</div>`));
    const rt=$(`<button class="small" style="margin-top:16px;margin-left:10px">🔁 Retake this set</button>`);
    rt.onclick=()=>startIdiomSet(iq.set);
    const hm=$(`<button class="small" style="margin-top:16px;margin-left:10px">← Idioms home</button>`);
    hm.onclick=()=>{ state.iq=null; render(); };
    card.appendChild(rt); card.appendChild(hm);
    app.appendChild(card);
    return;
  }
  ipQuestion({ lang, header:`Idioms · set ${iq.set+1}/${sets}`, prompt:`Type the ${d.name} idiom — accents optional`,
    count:iq.items.length, pos:iq.pos, nOk:iq.nOk, item:iq.items[iq.pos],
    extraFeedback:w=>`${w.lit?`<div class="expl">Literally: “${w.lit}”</div>`:''}${w.hint?`<div class="expl" style="font-style:italic;color:var(--muted)">💡 ${w.hint}</div>`:''}`,
    onQuit:()=>{ state.iq=null; render(); },
    onAnswered:ok=>{
      if(ok) iq.nOk++;
      iq.pos++;
      if(iq.pos<iq.items.length){ render(); return; }
      const pp=getIdiomProg(lang);
      pp.best[iq.set]=Math.max(pp.best[iq.set]||0, iq.nOk);
      if(iq.set===pp.next) pp.next=iq.set+1;
      saveIdiomProg(lang,pp);
      iq.end=true; render();
    }});
}
function startIdiomSet(set){
  const lang=state.ipLang;
  const list=idiomList(lang);
  state.iq={set, items:shuffle(list.slice(set*10, set*10+10)), pos:0, nOk:0};
  render();
}

function renderPhrases(){
  const lang=state.ipLang, d=DATA[lang];
  const topics=phraseTopics(lang);
  const pq=state.pq;
  if(!pq){
    app.appendChild($(`<span class="backlink" id="back">← Home</span>`));
    app.querySelector('#back').onclick=()=>{ state.screen='home'; render(); };
    app.appendChild($(`<h1>${d.flag} 💬 Useful Phrases</h1>`));
    app.appendChild($(`<div class="sub">Pick a subject — each quiz asks 10 phrases from it (typed, accents optional).</div>`));
    const p=getPhraseProg(lang);
    const card=$(`<div class="card"><div class="row" id="topics"></div></div>`);
    for(const tp of topics){
      const best=p[tp.id];
      const b=$(`<button style="flex:1;min-width:220px;padding:14px;text-align:left">${tp.title}<br><span class="pill">${tp.items.length} phrases${best!=null?` · best ${best}/10`:''}</span></button>`);
      b.onclick=()=>{ state.pq={topic:tp, items:shuffle([...tp.items]).slice(0,10), pos:0, nOk:0}; render(); };
      card.querySelector('#topics').appendChild(b);
    }
    app.appendChild(card);
    return;
  }
  if(pq.end){
    const card=$(`<div class="card" style="text-align:center"></div>`);
    card.appendChild($(`<h2 style="margin-top:0">${pq.nOk===pq.items.length?'🎉 Perfect!':'Done!'}</h2>`));
    card.appendChild($(`<div style="line-height:1.7">${pq.topic.title}: <b>${pq.nOk} / ${pq.items.length}</b></div>`));
    const ag=$(`<button class="primary" style="margin-top:16px">🔁 Same subject, new 10</button>`);
    ag.onclick=()=>{ state.pq={topic:pq.topic, items:shuffle([...pq.topic.items]).slice(0,10), pos:0, nOk:0}; render(); };
    const ot=$(`<button class="small" style="margin-top:16px;margin-left:10px">Choose another subject</button>`);
    ot.onclick=()=>{ state.pq=null; render(); };
    card.appendChild(ag); card.appendChild(ot);
    app.appendChild(card);
    return;
  }
  ipQuestion({ lang, header:`Phrases · ${pq.topic.title}`, prompt:`Type the ${d.name} phrase — accents optional`,
    count:pq.items.length, pos:pq.pos, nOk:pq.nOk, item:pq.items[pq.pos],
    onQuit:()=>{ state.pq=null; render(); },
    onAnswered:ok=>{
      if(ok) pq.nOk++;
      pq.pos++;
      if(pq.pos<pq.items.length){ render(); return; }
      const p=getPhraseProg(lang);
      p[pq.topic.id]=Math.max(p[pq.topic.id]||0, pq.nOk);
      savePhraseProg(lang,p);
      pq.end=true; render();
    }});
}

// Accent shortcut: Ctrl+letter types the language's special character into the
// focused answer box (Shift+Ctrl for capitals). Letters with two variants
// cycle on a repeated press (Dutch Ctrl+e: é -> ë; Italian: è -> é).
// Spanish ñ lives on Ctrl+m — Chrome reserves Ctrl+n for a new window.
const CTRL_CHARS = {
  german:  {a:['ä'], o:['ö'], u:['ü'], s:['ß']},
  dutch:   {e:['é','ë'], i:['ï'], o:['ö'], u:['ü']},
  italian: {a:['à'], e:['è'], i:['ì'], o:['ò'], u:['ù']},   // grave (falls from the left)
  spanish: {a:['á'], e:['é'], i:['í'], o:['ó'], u:['ú','ü'], m:['ñ']},
  irish:   {a:['á'], e:['é'], i:['í'], o:['ó'], u:['ú']},
};
const ALT_CHARS = {
  italian: {e:['é']},                                        // acute (rises from the left)
};
const CTRL_HINT = {
  german:  ' · Ctrl+a/o/u/s = ä/ö/ü/ß',
  dutch:   ' · Ctrl+e/i/o/u = é/ï/ö/ü (Ctrl+e again = ë)',
  italian: ' · Ctrl+a/e/i/o/u = à/è/ì/ò/ù · Alt+e = é',
  spanish: ' · Ctrl+a/e/i/o/u = á/é/í/ó/ú · Ctrl+m = ñ',
  irish:   ' · Ctrl+a/e/i/o/u = á/é/í/ó/ú',
};
// key combo that produces a given character (for the accent buttons' tooltips)
function comboFor(lang, ch){
  const scan=(m,mod)=>{ for(const k in (m||{})){ const i=m[k].indexOf(ch); if(i>=0) return mod+'+'+k.toUpperCase()+(i>0?' pressed '+(i+1)+'×':''); } return null; };
  return scan(CTRL_CHARS[lang],'Ctrl') || scan(ALT_CHARS[lang],'Alt');
}
function activeQuizLang(){
  if(state.screen==='daily'||state.screen==='dailyhist') return state.dailyLang;
  if(state.screen==='hundred') return state.hundredLang;
  if(state.screen==='climb') return state.climbLang;
  if(state.screen==='voice') return state.voiceLang;
  return state.lang;
}

// ---------- Voice Drill (hear target → say English / hear English → spell target) ----------
const VOICE_LANGS=['german','italian','dutch','spanish','japanese'];  // Irish: browsers ship no voice
const SR_CLS = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function getVoice(lang){
  try{ const o=JSON.parse(localStorage.getItem('lq_voice_'+lang)||'null')||{};
    return {a:o.a||{n:0,best:0}, b:o.b||{n:0,best:0}};
  }catch(e){ return {a:{n:0,best:0}, b:{n:0,best:0}}; }
}
function saveVoice(lang,V){ localStorage.setItem('lq_voice_'+lang, JSON.stringify(V)); }
function startVoiceRound(dir){
  const lang=state.voiceLang;
  const pool=duoFlat(lang).filter(it=>it&&it.t&&it.e);
  state.vq={dir, items:shuffle([...pool]).slice(0,10), pos:0, nOk:0, wrong:[]};
  render();
}
function renderVoice(){
  const lang=state.voiceLang, d=DATA[lang], vq=state.vq;
  if(!vq){  // direction picker
    const back=$(`<button class="small">← Home</button>`);
    back.onclick=()=>{ state.screen='home'; render(); };
    app.appendChild(back);
    app.appendChild($(`<h1>${d.flag} 🎤 Voice Drill</h1>`));
    const V=getVoice(lang);
    const srNote = SR_CLS ? '' : `<div class="voiceNote">⚠️ This browser has no speech recognition — in “say the English” rounds you'll type your answer instead. (Chrome, Edge and iPhone Safari all support it.)</div>`;
    app.appendChild($(`<div class="sub">Ten words per round, drawn from the whole ${d.name} vocabulary. Answers are graded like every other quiz — accents optional, any listed translation counts.</div>`));
    const row=$(`<div class="row"></div>`);
    const a=$(`<button style="flex:1;min-width:230px;padding:18px">🔊 ${d.name} → 🗣 English<br><span class="pill">hear the word · say (or type) the English${V.a.n?` · best ${V.a.best}%`:''}</span></button>`);
    a.onclick=()=>startVoiceRound('a');
    const b=$(`<button style="flex:1;min-width:230px;padding:18px">🔊 English → ⌨ ${d.name}<br><span class="pill">hear the English · spell the word${V.b.n?` · best ${V.b.best}%`:''}</span></button>`);
    b.onclick=()=>startVoiceRound('b');
    row.appendChild(a); row.appendChild(b);
    app.appendChild(row);
    if(srNote) app.appendChild($(srNote));
    return;
  }
  if(vq.pos>=vq.items.length){  // round over
    const pct=Math.round(vq.nOk/vq.items.length*100);
    const V=getVoice(lang); const slot=V[vq.dir];
    slot.n++; if(pct>slot.best) slot.best=pct; saveVoice(lang,V);
    app.appendChild($(`<h1>${d.flag} Round over — ${vq.nOk} / ${vq.items.length}</h1>`));
    if(vq.wrong.length) app.appendChild($(`<div class="card"><h2 style="margin-top:0">Missed</h2>${vq.wrong.map(w=>`<div style="margin:6px 0">${jpDisp(w.t)} = ${w.e}</div>`).join('')}</div>`));
    const row=$(`<div class="row" style="margin-top:14px"></div>`);
    const rt=$(`<button class="primary">🔁 New round</button>`);
    rt.onclick=()=>startVoiceRound(vq.dir);
    const q=$(`<button>✕ Done</button>`);
    q.onclick=()=>{ state.vq=null; render(); };
    row.appendChild(rt); row.appendChild(q);
    app.appendChild(row);
    return;
  }
  const w=vq.items[vq.pos];
  const top=$(`<div class="topnav"><button class="small">✕ Quit</button><span style="color:var(--muted);font-size:.9rem">${d.flag} Voice Drill · word ${vq.pos+1} / ${vq.items.length} · ✓ ${vq.nOk}</span></div>`);
  top.querySelector('button').onclick=()=>{ state.vq=null; render(); };
  app.appendChild(top);
  const card=$(`<div class="card"></div>`);
  const dirA = vq.dir==='a';
  const promptLang = dirA ? d.ttsLang : 'en-US';
  const promptText = dirA ? w.t : w.e;
  card.appendChild($(`<div class="qWord">${dirA ? '🔊 …' : maskPrompt(w.e, w.t, lang)}</div>`));
  card.appendChild($(`<div class="qHint">${dirA ? `Listen, then say (or type) the <b>English</b> meaning` : lang==='japanese' ? 'Listen, then type the Japanese word in romaji — it becomes hiragana' : `Listen, then type the ${d.name} word — accents optional; nouns need their article`}</div>`));
  const replay=$(`<button class="small" style="display:block;margin:4px auto 10px">🔊 Play again</button>`);
  replay.onclick=()=>speak(promptText, promptLang);
  card.appendChild(replay);
  let answered=false;
  const wrap=$(`<div style="max-width:560px;margin:0 auto;text-align:center"></div>`);
  const finish=(ok, note)=>{
    if(answered) return; answered=true;
    if(ok) vq.nOk++; else vq.wrong.push({t:w.t, e:w.e});
    inp.disabled=true; go.style.display='none'; if(mic) mic.disabled=true;
    inp.style.borderColor= ok?'var(--good)':'var(--bad)';
    const fb=$(`<div class="feedback"></div>`);
    fb.appendChild($(`<div style="font-weight:600;color:${ok?'var(--good)':'var(--bad)'}">${ok?'✔ Correct!':'✘ Not quite'}${note?` <span style="color:var(--muted);font-weight:400">${note}</span>`:''}</div>`));
    fb.appendChild($(`<div class="expl">${jpDisp(w.t)} = ${w.e}</div>`));
    if(!dirA && window.speechSynthesis) speak(w.t, d.ttsLang);
    const next=$(`<button class="primary" style="margin-top:10px">${vq.pos+1>=vq.items.length?'Finish round':'Next →'}</button>`);
    next.onclick=()=>{ vq.pos++; render(); };
    fb.appendChild(next);
    card.appendChild(fb);
    next.focus();
  };
  let mic=null;
  if(dirA && SR_CLS){
    mic=$(`<button class="primary" style="font-size:1.15rem;padding:14px 26px;margin-bottom:12px">🎤 Tap & speak</button>`);
    mic.onclick=()=>{
      const r=new SR_CLS();
      r.lang='en-US'; r.interimResults=false; r.maxAlternatives=5;
      mic.textContent='🎙 Listening…'; mic.style.opacity=.7;
      r.onresult=(ev)=>{
        const alts=[...ev.results[0]].map(x=>x.transcript);
        const hit=alts.find(a=>englishAnswerOk(a, w.e));
        finish(!!hit, `heard “${hit||alts[0]}”`);
      };
      r.onerror=(ev)=>{
        mic.textContent='🎤 Tap & speak'; mic.style.opacity=1;
        if(ev.error==='not-allowed') wrap.insertBefore($(`<div class="voiceNote">⚠️ Microphone blocked — allow mic access for this site, or type your answer below.</div>`), inp);
      };
      r.onend=()=>{ if(!answered){ mic.textContent='🎤 Tap & speak'; mic.style.opacity=1; } };
      try{ r.start(); }catch(e){}
    };
    wrap.appendChild(mic);
  }
  const inp=$(`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;padding:14px 16px;font-size:1.1rem;border-radius:10px;border:2px solid var(--border);background:var(--card2);color:var(--text);outline:none" placeholder="${dirA?(SR_CLS?'…or type the English here':'Type the English here'):'Type here…'}">`);
  if(!dirA) jpBind(inp, lang);
  const accRow=$(`<div style="display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap"></div>`);
  if(!dirA) (ACCENTS[lang]||[]).forEach(chr=>{
    const b=$(`<button class="small" style="min-width:38px;font-size:1.05rem">${chr}</button>`);
    const cb=comboFor(lang,chr); if(cb) b.title=cb;
    b.onclick=()=>{ const s=inp.selectionStart||inp.value.length; inp.value=inp.value.slice(0,s)+chr+inp.value.slice(inp.selectionEnd||s); inp.focus(); inp.setSelectionRange(s+1,s+1); };
    accRow.appendChild(b);
  });
  const go=$(`<button class="primary">Check</button>`);
  const doCheck=()=>{
    if(answered || !inp.value.trim()) return;
    finish(dirA ? englishAnswerOk(inp.value, w.e) : vocabAnswerOk(inp.value, w.t));
  };
  go.onclick=doCheck;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); e.__consumed=true; window.__enterTs=Date.now(); doCheck(); } });
  wrap.appendChild(inp); wrap.appendChild(accRow); wrap.appendChild(go);
  card.appendChild(wrap);
  app.appendChild(card);
  setTimeout(()=>{ speak(promptText, promptLang); if(!dirA||!SR_CLS) inp.focus(); }, 250);
}
document.addEventListener('keydown', (e)=>{
  if(e.metaKey) return;
  let map = null;
  if(e.ctrlKey && !e.altKey) map = CTRL_CHARS[activeQuizLang()];
  else if(e.altKey && !e.ctrlKey) map = ALT_CHARS[activeQuizLang()];
  if(!map) return;
  const k = (e.key||'').toLowerCase();
  const ae = document.activeElement;
  if(!map || !map[k] || !ae || ae.tagName!=='INPUT' || ae.type!=='text' || ae.disabled) return;
  e.preventDefault();
  const vars = map[k].map(c=> e.shiftKey && c!=='ß' ? c.toUpperCase() : c);
  let s = ae.selectionStart==null ? ae.value.length : ae.selectionStart;
  const e2 = ae.selectionEnd==null ? s : ae.selectionEnd;
  const prev = s===e2 && s>0 ? ae.value[s-1] : '';
  const at = vars.indexOf(prev);
  if(at>=0){  // repeated press: cycle the character just typed
    ae.value = ae.value.slice(0,s-1) + vars[(at+1)%vars.length] + ae.value.slice(e2);
    ae.setSelectionRange(s, s);
  } else {
    ae.value = ae.value.slice(0,s) + vars[0] + ae.value.slice(e2);
    ae.setSelectionRange(s+1, s+1);
  }
});

// Global Enter key: always mirror the visible primary action (Check / Check all /
// Next / Finish), no matter what has focus. Enter inside the SINGLE answer box
// clicks Check directly (belt-and-suspenders on top of the input's own handler —
// every doCheck is guarded, so a double call is a no-op). Multi-row screens
// (conjugation/tables) keep their own Enter row-navigation. If the primary
// button itself is focused the browser clicks it natively.
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter' && e.keyCode!==13) return;
  // a HELD Enter auto-repeats onto the newly-focused Next button and blows
  // straight past the feedback — one press, one action, always
  if(e.repeat){ e.preventDefault(); return; }
  const ae = document.activeElement;
  const tag = ae ? ae.tagName : '';
  if(tag==='TEXTAREA' || tag==='SELECT') return;
  if(tag==='INPUT' && ae.type!=='checkbox' && !ae.disabled){
    // multi-input screens handle Enter per row — leave them alone
    const txts=[...document.querySelectorAll('#app input[type="text"]')].filter(x=>x.offsetParent && !x.disabled);
    if(txts.length>1) return;
    // My Words / manager inputs have their own Enter actions (no Check on screen)
  }
  if(e.__consumed){ e.preventDefault(); return; }  // an answer-box handler already acted on this press
  // key-bounce guard only: 150ms. A deliberate second Enter (check → advance)
  // must work as fast as clicking Check then Next with the mouse — held-key
  // repeat is already suppressed above.
  const now = Date.now();
  if(now - (window.__enterTs||0) < 150){ e.preventDefault(); return; }
  window.__enterTs = now;
  const btns = [...document.querySelectorAll('#app button')].filter(b=>b.offsetParent && !b.disabled && b.style.display!=='none');
  const label = b=>b.textContent.trim();
  const target = btns.find(b=>label(b)==='Check' || label(b)==='Check all')
              || btns.find(b=>label(b)==='Next →' || label(b)==='Finish' || label(b)==='Finish pass'
                           || label(b)==='Finish round' || label(b)==='Start the questions →' || label(b).startsWith('🔁 Retake'));
  if(!target) return;
  // click it ourselves and suppress native activation — one deterministic
  // click whether or not the button happens to be focused
  e.preventDefault(); target.click();
});

render();
</script>
</body>
</html>
