<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quizzes">
<title>Language Quizzes</title>
<style>
  :root{
    --bg:#0f1220; --card:#1a1f35; --card2:#232a4a; --text:#e8eaf6; --muted:#9aa3c7;
    --accent:#6c8cff; --good:#3ddc84; --bad:#ff5c7a; --warn:#ffb74d; --border:#2e3660;
    color-scheme:dark;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}
  .wrap{max-width:880px; margin:0 auto; padding:24px 16px 60px;}
  h1{font-size:1.6rem; margin-bottom:4px;}
  h2{font-size:1.2rem; margin:18px 0 10px;}
  .sub{color:var(--muted); font-size:.92rem; margin-bottom:20px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:14px;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; padding:10px 16px; font-size:1rem; background:var(--card2); color:var(--text); transition:.15s;}
  button:hover{filter:brightness(1.2);}
  button.primary{background:var(--accent); color:#fff; font-weight:600;}
  button.small{padding:5px 10px; font-size:.85rem;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .langBtn{flex:1; min-width:180px; font-size:1.25rem; padding:26px 16px; display:flex; flex-direction:column; align-items:center; gap:8px; border:2px solid var(--border);}
  .langBtn .flag{font-size:2.6rem;}
  .langBtn.active{border-color:var(--accent); background:var(--card2);}
  .pill{display:inline-block; background:var(--card2); border-radius:999px; padding:3px 10px; font-size:.78rem; color:var(--muted); margin-left:6px;}
  .unit{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; margin:2px 0;}
  .unit:hover{background:var(--card2);}
  .unit label{flex:1; cursor:pointer; font-size:.95rem;}
  .unit input{width:18px; height:18px; accent-color:var(--accent); cursor:pointer;}
  .unit .cnt{color:var(--muted); font-size:.82rem; white-space:nowrap;}
  .courseHead{display:flex; align-items:center; justify-content:space-between; margin:14px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--border);}
  .courseHead h3{font-size:1.02rem; color:var(--accent);}
  .opts{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0;}
  .opt{background:var(--card2); border:2px solid transparent; border-radius:10px; padding:8px 14px; cursor:pointer; font-size:.92rem;}
  .opt.sel{border-color:var(--accent);}
  .startBar{position:sticky; bottom:12px; display:flex; gap:10px; align-items:center; background:var(--card2); border:1px solid var(--border); border-radius:14px; padding:12px 16px; margin-top:16px; box-shadow:0 6px 24px rgba(0,0,0,.4);}
  .startBar .info{flex:1; font-size:.92rem; color:var(--muted);}
  /* quiz */
  .qTop{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; color:var(--muted); font-size:.9rem;}
  .qWord{font-size:2rem; font-weight:700; text-align:center; margin:18px 0 6px; min-height:2.4rem;}
  .qHint{text-align:center; color:var(--muted); margin-bottom:14px; font-size:.95rem;}
  .speakBtn{display:block; margin:0 auto 18px; font-size:1.5rem; background:var(--card2); border-radius:50%; width:58px; height:58px;}
  .choices{display:grid; grid-template-columns:1fr; gap:10px; max-width:560px; margin:0 auto;}
  @media(min-width:640px){.choices.two{grid-template-columns:1fr 1fr;}}
  .choice{padding:14px 16px; text-align:left; font-size:1.02rem; border:2px solid var(--border); background:var(--card);}
  .choice.correct{border-color:var(--good); background:rgba(61,220,132,.12);}
  .choice.wrong{border-color:var(--bad); background:rgba(255,92,122,.12);}
  .feedback{max-width:560px; margin:14px auto 0; text-align:center;}
  .feedback .expl{color:var(--muted); font-size:.92rem; margin-top:6px;}
  .barOuter{height:6px; background:var(--card2); border-radius:3px; overflow:hidden; margin-bottom:16px;}
  .barInner{height:100%; background:var(--accent); width:0%; transition:width .3s;}
  .resultBig{font-size:2.4rem; font-weight:700; text-align:center; margin:10px 0;}
  .missItem{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; background:var(--card2); margin:5px 0; font-size:.95rem;}
  .missItem .w{font-weight:600;}
  .learnedTag{color:var(--good); font-size:.8rem;}
  .backlink{color:var(--accent); cursor:pointer; font-size:.9rem; margin-bottom:14px; display:inline-block;}
  .tabs{display:flex; gap:8px; margin-bottom:14px;}
  .voiceNote{font-size:.8rem; color:var(--muted); margin-top:8px;}
  .topnav{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  @media (max-width:640px){
    .wrap{padding:12px 10px;}
    h1{font-size:1.45rem;} h2{font-size:1.1rem;}
    .qWord{font-size:1.5rem;}
    .langBtn{min-width:44%; flex:1;}
    .langBtn .flag{font-size:2rem;}
    input[type=text]{font-size:16px !important;}  /* <16px makes iOS zoom the page */
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="data_german.js"></script>
<script src="data_italian.js"></script>
<script src="data_dutch.js"></script>
<script src="data_irish.js"></script>
<script src="data_spanish.js"></script>
<script src="wanakana.min.js"></script>
<script src="data_japanese.js"></script>
<script src="data_extra.js"></script>
<script src="data_conjugation.js"></script>
<script src="data_duolingo.js"></script>
<script src="data_idioms.js"></script>
<script src="data_paradigms.js"></script>
<script src="data_plurals.js"></script>
<script src="data_ip_german.js"></script>
<script src="data_ip_italian.js"></script>
<script src="data_ip_dutch.js"></script>
<script src="data_ip_spanish.js"></script>
<script>
"use strict";
const $ = (h)=>{const d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild;};
const app = document.getElementById('app');
const DATA = window.QUIZ_DATA;
const LANGS = ['german','italian','dutch','irish','spanish','japanese'];

// Merge transcript-mined additions (data_extra.js) into the base units, skipping duplicates.
(function mergeExtras(){
  const X = window.QUIZ_EXTRA || {};
  const norm = s => s.toLowerCase().replace(/\s+/g,' ').trim();
  for(const l of LANGS){
    const ex = X[l]; if(!ex || !DATA[l]) continue;
    const units = {};
    DATA[l].courses.forEach(c=>c.units.forEach(u=>units[u.id]=u));
    for(const [uid, items] of Object.entries(ex)){
      const u = units[uid]; if(!u || u.type!=='vocab' || !Array.isArray(items)) continue;
      const seen = new Set(u.items.map(i=>norm(i.t)));
      for(const it of items){
        if(!it || !it.t || !it.e) continue;
        const k = norm(it.t);
        if(seen.has(k)) continue;
        seen.add(k);
        u.items.push({t: it.t, e: it.e});
      }
    }
  }
})();

// Attach conjugation-drill units (data_conjugation.js) to their courses.
(function mergeConj(){
  const C = window.QUIZ_CONJ || {};
  for(const l of LANGS){
    if(!C[l] || !DATA[l]) continue;
    for(const entry of C[l]){
      const course = DATA[l].courses.find(c=>c.id===entry.course);
      if(course && !course.units.some(u=>u.id===entry.unit.id)) course.units.push(entry.unit);
    }
  }
})();

// Attach Duolingo vocabulary courses (data_duolingo.js, generated from AnkiWeb shared decks).
(function mergeDuo(){
  for(const entry of (window.QUIZ_DUO_LIST||[])){
    const d = DATA[entry.lang];
    if(d && !d.courses.some(c=>c.id===entry.course.id)) d.courses.push(entry.course);
  }
})();

// Attach idiom units (data_idioms.js) to their courses.
(function mergeAddons(){
  for(const entry of (window.QUIZ_ADDON_UNITS||[])){
    const d = DATA[entry.lang]; if(!d) continue;
    const course = d.courses.find(c=>c.id===entry.course);
    if(course && !course.units.some(u=>u.id===entry.unit.id)) course.units.push(entry.unit);
  }
})();

const PERSONS = {
  german: ['ich','du','er/sie/es','wir','ihr','sie/Sie'],
  italian: ['io','tu','lui/lei','noi','voi','loro'],
  dutch: ['ik','jij','hij/zij','wij','jullie','zij'],
  irish: ['mé','tú','sé/sí','muid','sibh','siad'],
  spanish: ['yo','tú','él/ella/usted','nosotros','ustedes','ellos/ellas']
};
// Conjugation drills show ENGLISH person labels and require the pronoun to be
// typed with the verb form ("ich mache", "io parlo"). PRON lists the accepted
// pronoun(s) per row; Irish rows are empty because Irish forms already embed
// the pronoun where the language uses one (ólaim / ólann tú).
const PERSONS_EN = {
  german: ['I','you (sg.)','he/she/it','we','you (pl.)','they / you (formal)'],
  italian: ['I','you (sg.)','he/she','we','you (pl.)','they'],
  dutch: ['I','you (sg.)','he/she','we','you (pl.)','they'],
  irish: ['I','you (sg.)','he/she','we','you (pl.)','they'],
  spanish: ['I','you (sg.)','he/she / you (formal)','we','you (pl.: ustedes)','they']
};
const PRON = {
  german: [['ich'],['du'],['er','sie','es'],['wir'],['ihr'],['sie','Sie']],
  italian: [['io'],['tu'],['lui','lei'],['noi'],['voi'],['loro']],
  dutch: [['ik'],['jij','je'],['hij','zij','ze'],['wij','we'],['jullie'],['zij','ze']],
  irish: [[],[],[],[],[],[]],
  spanish: [['yo'],['tú'],['él','ella','usted'],['nosotros','nosotras'],['ustedes'],['ellos','ellas']]
};
// plain=true (paradigm tables with custom rows): the form itself is the answer,
// no pronoun prefix required.
function conjCanon(lang,i,f,plain){ const p=plain?null:PRON[lang][i]; return (p&&p.length? p.join('/')+' ' : '')+f; }
function conjSpeakText(lang,item){
  const plain=!!item.rows;
  return item.forms.map((f,i)=>{ const p=plain?null:PRON[lang][i]; return (p&&p.length? p[0]+' ':'')+f.split('/')[0]; }).join(', ');
}
function conjRowOk(lang,i,typed,f,plain){
  const variants=f.split('/').map(v=>v.trim());
  const prons=plain?[]:(PRON[lang][i]||[]);
  if(!prons.length) return variants.some(v=>answerMatches(typed,v));
  return prons.some(p=>variants.some(v=>answerMatches(typed, p+' '+v)));
}

// ---------- state ----------
let state = {
  lang: null,
  screen: 'home',        // home | setup | quiz | result | learned
  quizType: 'vocab',     // vocab | grammar
  vocabMode: 'toEN',     // toEN | fromEN | listen
  qCount: 15,            // 10 | 15 | 25 | 9999 (all)
  selectedUnits: new Set(),
  quiz: null,
};

// ---------- learned words (persisted) ----------
function learnedKey(lang){ return 'lq_learned_'+lang; }
function getLearned(lang){
  try{ return new Set(JSON.parse(localStorage.getItem(learnedKey(lang))||'[]')); }catch(e){ return new Set(); }
}
function saveLearned(lang,set){ localStorage.setItem(learnedKey(lang), JSON.stringify([...set])); }
function vocabId(item){ return item.t; }

// remember unit selections per language
function selKey(lang){ return 'lq_sel_'+lang; }
function loadSel(lang){
  try{ return new Set(JSON.parse(localStorage.getItem(selKey(lang))||'[]')); }catch(e){ return new Set(); }
}
function saveSel(){ if(state.lang) localStorage.setItem(selKey(state.lang), JSON.stringify([...state.selectedUnits])); }

// ---------- speech ----------
let voices = [];
function refreshVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis){ refreshVoices(); speechSynthesis.onvoiceschanged = refreshVoices; }
function bestVoice(langCode){
  const lc = langCode.toLowerCase();
  const cand = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith(lc.slice(0,2)));
  if(!cand.length) return null;
  // prefer exact region, then Google/Microsoft "online/natural" voices
  cand.sort((a,b)=>{
    const ax=a.lang.toLowerCase()===lc?0:1, bx=b.lang.toLowerCase()===lc?0:1;
    if(ax!==bx) return ax-bx;
    const an=/natural|online|google/i.test(a.name)?0:1, bn=/natural|online|google/i.test(b.name)?0:1;
    return an-bn;
  });
  return cand[0];
}
function speak(text, langCode){
  if(!window.speechSynthesis) return;
  if(!bestVoice(langCode)) return; // no voice for this language (e.g. Irish) — stay silent rather than mispronounce
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langCode;
  const v = bestVoice(langCode);
  if(v) u.voice = v;
  u.rate = 0.88;
  speechSynthesis.speak(u);
}
function hasVoice(langCode){ return !!bestVoice(langCode); }

// ---------- helpers ----------
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
// Accent-tolerant answer matching: "uber"≈"über", "perche"≈"perché"; articles optional.
// Japanese: kana/kanji would fold to '' under the Latin fold, so they get
// their own. wanakana converts typed romaji (and katakana) to hiragana, so
// "mizu", ミズ and みず all fold identically.
const JP_RX = /[぀-ヿ一-鿿]/;
function jpFold(s){
  s = (s||'').trim().toLowerCase();
  if(window.wanakana){ try{ s = wanakana.toHiragana(s); }catch(e){} }
  return s.replace(/[^぀-ヿ一-鿿a-z0-9ー]/g,'');
}
// Kanji readings live in the duo data (romaji field "r"), looked up by surface
// form — climb/miss storage keeps its plain {t,e} shape (whose "r" is the
// review flag, not romaji).
let __jpR = null;
function jpReading(t){
  if(!__jpR){
    __jpR = {};
    try{ duoFlat('japanese').forEach(it=>{ const v=it.k||it.r; if(v && !__jpR[it.t]) __jpR[it.t]=v; }); }catch(e){}
  }
  const v = __jpR[t];
  if(!v) return '';
  if(JP_RX.test(v)) return v;                    // "k": kana reading, as-is
  return window.wanakana ? wanakana.toHiragana(v.toLowerCase()) : '';  // "r": romaji
}
// typed romaji/kana vs a Japanese answer: the word itself, or its kana reading
function jpMatch(typed, answer){
  const t = jpFold(typed);
  if(!t) return false;
  if(t === jpFold(answer)) return true;
  const k = jpReading(answer);
  return !!k && t === jpFold(k);
}
// kanji words render with furigana wherever the word is revealed
function jpDisp(t){
  if(!JP_RX.test(t)) return t;
  const k = jpReading(t);
  return (k && /[一-鿿]/.test(t)) ? `<ruby>${t}<rt style="font-size:.55em">${k}</rt></ruby>` : t;
}
function foldTxt(s){
  if(JP_RX.test(s)) return jpFold(s);
  return s.toLowerCase()
    .replace(/\(.*?\)/g,'')
    .replace(/ß/g,'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[’'`]/g,' ')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function stripArticle(s){
  return s.replace(/^(der|die|das|ein|eine|einen|de|het|een|il|lo|la|le|li|gli|i|un|uno|una|l|an|na|el|los|las|unos|unas)\s+/,'');
}
function answerMatches(typed, answer){
  if(JP_RX.test(answer)) return jpMatch(typed, answer);
  const t=foldTxt(typed);
  if(!t) return false;
  // accept plain-folded answer AND German-convention umlaut expansion (ü→ue etc.)
  const umlaut = answer.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue');
  for(const a of [foldTxt(answer), foldTxt(umlaut)]){
    if(t===a) return true;
    if(stripArticle(t)===stripArticle(a)) return true;
    if(t.replace(/\s+/g,'')===a.replace(/\s+/g,'')) return true;
    if(stripArticle(t).replace(/\s+/g,'')===stripArticle(a).replace(/\s+/g,'')) return true;
  }
  return false;
}
// Gender enforcement: when the stored answer begins with an article, the typed
// answer must include it (accents still optional) — "Tür" is NOT accepted for
// "die Tür", and neither is "der Tür".
function startsWithArticle(s){
  return /^(der|die|das|ein|eine|de|het|een|il|lo|la|le|gli|i|un|uno|una|an|na|el|los|las|unos|unas)\s/i.test(s) || /^l['’]/i.test(s);
}
function strictMatches(typed, answer){
  if(JP_RX.test(answer)) return jpMatch(typed, answer);
  const t = foldTxt(typed);
  if(!t) return false;
  const umlaut = answer.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue');
  for(const a of [foldTxt(answer), foldTxt(umlaut)]){
    if(t===a) return true;
    if(t.replace(/\s+/g,'')===a.replace(/\s+/g,'')) return true;
  }
  return false;
}
const SUBJ_PRON = new Set(['ich','du','er','sie','es','wir','ihr','io','tu','lui','lei','noi','voi','loro',
  'ik','jij','je','hij','u','wij','we','jullie','zij','ze','mé','me','tú','sé','sí','muid','sibh','siad',
  'yo','el','ella','usted','ustedes','nosotros','nosotras','ellos','ellas']);
function vocabAnswerOk(typed, answer){
  if(startsWithArticle(answer)) return strictMatches(typed, answer);
  if(answerMatches(typed, answer)) return true;
  // allow an optional subject pronoun before a bare verb form: "tu studi" for "studi"
  const m = typed.trim().match(/^(\S+)\s+(.+)$/);
  if(m && SUBJ_PRON.has(foldTxt(m[1])) && answerMatches(m[2], answer)) return true;
  return false;
}
const ACCENTS = { german:['ä','ö','ü','ß'], italian:['à','è','é','ì','ò','ù'], dutch:['é','ë','ï','ö','ü'], irish:['á','é','í','ó','ú'], spanish:['á','é','í','ó','ú','ñ','ü'] };
// Japanese answer boxes: type romaji, see hiragana (wanakana IME mode keeps a
// trailing "n" undecided until the next key; the checker converts leftovers).
function jpBind(inp, lang){
  if(lang!=='japanese' || !window.wanakana) return;
  try{ wanakana.bind(inp, {IMEMode:'toHiragana'}); }catch(e){}
  inp.placeholder='Type romaji — becomes かな…';
}
// Person-hint glosses embed the target form ("are (wir/sie/Sie sind)") — vital
// when the answer is revealed, but a giveaway as a prompt. As a prompt, drop the
// answer word and describe the person in English instead:
// "you are (du bist)" -> "you are (informal singular)",
// "are (wir/sie/Sie sind)" -> "are (we / they / formal)".
const PRON_EN = {
  german: {ich:'I', du:'informal singular', er:'he', es:'it', wir:'we', ihr:'informal plural', Sie:'formal'},
  italian:{io:'I', tu:'informal singular', lui:'he', lei:'she', noi:'we', voi:'plural', loro:'they'},
  dutch:  {ik:'I', jij:'informal singular', je:'informal singular', hij:'he', wij:'we', we:'we', jullie:'plural', u:'formal'},
  spanish:{yo:'I', 'tú':'informal singular', 'él':'he', ella:'she', usted:'formal singular',
           nosotros:'we', nosotras:'we', ustedes:'plural (ustedes)', ellos:'they', ellas:'they'},
  irish:  {}
};
function maskPrompt(e, answer, lang){
  if(!e || !e.includes('(') || !answer) return e;
  const ans = stripArticle(foldTxt(answer));
  if(!ans) return e;
  return e.replace(/\s*\(([^)]*)\)/g, (m, inner)=>{
    const words = inner.split(/[\s\/]+/).filter(Boolean);
    if(!words.some(w=>stripArticle(foldTxt(w))===ans)) return m;  // no leak in this hint
    const kept = words.filter(w=>stripArticle(foldTxt(w))!==ans);
    const pm = PRON_EN[lang]||{};
    let translated=false;
    const mapped = kept.map(w=>{
      const key = w.replace(/[:,]$/,'');
      if(key==='sie'||key==='zij'||key==='ze'){ translated=true;   // she vs they by context
        return kept.some(x=>/^(er|es|hij)$/.test(x)) ? 'she' : 'they'; }
      if(pm[key]!==undefined){ translated=true; return pm[key]; }
      return key;
    });
    const uniq = mapped.filter((x,i)=>mapped.indexOf(x)===i && x);
    if(!uniq.length) return '';
    // "I was (yo fui)" -> "(I)" adds nothing when the English already says I
    if(uniq.length===1 && new RegExp('\\b'+uniq[0]+'\\b').test(e.slice(0, e.indexOf('(')))) return '';
    // pronoun lists join with " / "; plain hint text keeps its spaces
    return ' ('+uniq.join(translated?' / ':' ')+')';
  });
}
// When the answer requires its article (stored "la rosa"), say so in the
// prompt: "the rose" — otherwise "rose" is ambiguous (noun vs adjective rosa).
function nounPrompt(e, t){
  // the answer IS an article ("l'", "il", "las") — nothing to mark
  if(/^(l['’]|der|die|das|ein|eine|il|lo|la|le|gli|i|el|los|las|un|uno|una|de|het|een|an|na)$/i.test(t.trim())) return e;
  if(!startsWithArticle(t)) return e;
  if(/^(the|a|an)\s/i.test(e)) return e;                       // authored glosses may already say "the"
  if(/^(each|one|to|i|you|he|she|we|they|it|that|this|these|those|there|what|who|how)\b/i.test(e)) return e;  // phrase/pronoun/sentence glosses
  if(/^(der|die|das|ein|eine)\s+[a-zäöüß]/.test(t.trim())) return e; // German nouns are capitalized — lowercase word after article = not a noun ("das ist")
  const indef = /^(ein|eine|un|uno|una|een)\s/i.test(t) || /^un['’]/i.test(t);
  return (indef ? 'a ' : 'the ') + e;
}
function pluralNote(lang, t){
  const p = (window.QUIZ_PLURALS && window.QUIZ_PLURALS[lang] || {})[t];

let _glossLk = {};
function glossLookup(lang){
  if(_glossLk[lang]) return _glossLk[lang];
  const fold = {}, exact = {};
  ((DATA[lang]||{}).courses||[]).forEach(c=>(c.units||[]).forEach(u=>{
    if(u.type!=='vocab'||!u.items) return;
    u.items.forEach(it=>{
      if(!it.t||!it.e) return;
      const k = stripArticle(foldTxt(it.t));
      if(k && !(k in fold)) fold[k] = it.e;
    });
  }));
  // exact spellings win — hatte/hätte and wurde/würde fold to the same key
  for(const [w,g] of Object.entries(FUNC_GLOSS[lang]||{})){
    exact[w.toLowerCase()] = g;
    const fk = foldTxt(w);
    if(!(fk in exact)) fold[fk] = g;
  }
  _glossLk[lang] = {fold, exact};
  return _glossLk[lang];
}
// For fill-in-the-blank grammar questions, rebuild the whole sentence with the
// answer slotted in ("Torno ___ ufficio" + "dall'" → "Torno dall'ufficio …").
function fullSentence(qtext, ans){
  const m = (qtext||'').match(/_{2,}/);
  if(!m || !ans) return '';
  let pre = qtext.slice(0, m.index), post = qtext.slice(m.index + m[0].length);
  if(/['’]$/.test(ans) && post.startsWith(' ')) post = post.slice(1); // dall' + ufficio
  return `${pre}<b>${ans}</b>${post}`;
}
function wordGlossNote(lang, answerText){
  const toks = (answerText||'').split(/[,;·]| \/ /).map(s=>s.trim()).filter(Boolean);
  if(!toks.length || toks.some(t=>t.split(/\s+/).length>3)) return '';
  const single = toks.length===1;
  const lk = glossLookup(lang), out=[];
  for(const t of toks){
    const raw = lk.exact[t.toLowerCase()] || lk.fold[stripArticle(foldTxt(t))];
    if(!raw) continue;
    // lists get the short first sense; a lone answer keeps its full gloss
    // ("hatte = had (ich/er hatte)")
    const g = single ? raw : raw.replace(/\(.*?\)/g,'').split('/')[0].trim();
    if(g && foldTxt(g)!==foldTxt(t)) out.push(`${t} = ${g}`);
  }
  if(out.length < (single ? 1 : Math.max(2, Math.ceil(toks.length*0.6)))) return '';
  return out.join(' · ');
}

// ---------- custom words (My Words) ----------
// Stored shape: { cats:[{id,name}], words:[{id, en, tr:{german,italian,dutch}, cats:[catId]}] }
// Categories are shared across languages; a word may sit in several categories at once.
function getCustom(){
  try{ const c=JSON.parse(localStorage.getItem('lq_custom')||'null')||{}; return {cats:c.cats||[], words:c.words||[]}; }
  catch(e){ return {cats:[], words:[]}; }
}
function saveCustom(c){ localStorage.setItem('lq_custom', JSON.stringify(c)); }
function customUnitsFor(lang){
  const c = getCustom();
  const units = [];
  const mk = (id,name,ws)=>({ id, type:'vocab', custom:true, title:'My Words: '+name,
    items: ws.map(w=>({t:w.tr[lang], e:w.en})) });
  for(const cat of c.cats){
    const ws = c.words.filter(w=>w.tr && w.tr[lang] && (w.cats||[]).includes(cat.id));
    if(ws.length) units.push(mk('cust_'+cat.id, cat.name, ws));
  }
  const uncat = c.words.filter(w=>w.tr && w.tr[lang] && !(w.cats||[]).length);
  if(uncat.length) units.push(mk('cust_uncat','Uncategorized', uncat));
  return units;
}
// Duplicate lookup: does this English word / this translation already exist for a language?
function normEnVariants(e){
  return e.split('/').map(v=>foldTxt(v).replace(/^(the|a|an|to)\s+/,'')).filter(Boolean);
}
function findDup(lang, en, tr){
  const enN = normEnVariants(en||'');
  const trN = tr ? stripArticle(foldTxt(tr)) : null;
  const scan = (items, where)=>{
    for(const it of items){
      if(trN && stripArticle(foldTxt(it.t))===trN) return {kind:'translation', t:it.t, e:it.e, where};
      if(enN.length && normEnVariants(it.e).some(v=>enN.includes(v))) return {kind:'english', t:it.t, e:it.e, where};
    }
    return null;
  };
  for(const course of DATA[lang].courses)
    for(const u of course.units){
      if(u.type!=='vocab') continue;
      const hit = scan(u.items, u.title.replace(/^Vocab[^:]*:\s*/,''));
      if(hit) return hit;
    }
  const c = getCustom();
  const mine = c.words.filter(w=>w.tr && w.tr[lang]).map(w=>({t:w.tr[lang], e:w.en}));
  return scan(mine, 'My Words');
}
// Free MyMemory translation API (no key). Returns {best, alts:[...]} or throws.
const MM_LANG = { german:'de', italian:'it', dutch:'nl', irish:'ga', spanish:'es' };
// Reverse direction: target-language word in, English out.
async function suggestEnglish(word, lang){
  return mmSuggest(word, MM_LANG[lang]+'|en');
}
async function suggestTranslation(en, lang){
  return mmSuggest(en, 'en|'+MM_LANG[lang]);
}
async function mmSuggest(q, langpair){
  const url = 'https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+langpair;
  const r = await fetch(url).then(r=>r.json());
  const fixCaps = s => (s===s.toUpperCase() && /[A-Za-z]/.test(s)) ? s.toLowerCase() : s;
  let best = fixCaps((r.responseData && r.responseData.translatedText || '').trim());
  const seen = new Set([foldTxt(best)]);
  const alts = [];
  for(const m of (r.matches||[])){
    const t = fixCaps((m.translation||'').trim());
    // skip sentence-like matches: too long, too many words, or trailing punctuation
    if(!t || t.length>30 || t.split(/\s+/).length>3 || /[.!?,;:]$/.test(t)) continue;
    const k = foldTxt(t);
    if(seen.has(k)) continue;
    seen.add(k);
    alts.push(t);
    if(alts.length>=4) break;
  }
  // if the main result looks like a sentence and a concise alternative exists, promote it
  if((best.split(/\s+/).length>3 || best.length>34) && alts.length){
    best = alts.shift();
  }
  if(!best) throw new Error('no suggestion');
  return { best, alts };
}

// ---------- mastery tally ----------
// A word counts as mastered when: marked learned, OR daily-mastered (3
// consecutive first-try correct), OR part of a completed 100-Word Quiz, OR
// removed from a climb as "I know this". Deduplicated across sources.
const CEFR_LEVELS=[[500,'A1'],[1500,'A2'],[3000,'B1'],[5000,'B2'],[10000,'C1']];
function masteredCount(lang){
  const key=t=>stripArticle(foldTxt(t));
  const s=new Set();
  for(const t of getLearned(lang)) s.add(key(t));
  const D=getDaily(lang);
  for(const [t,st] of Object.entries(D.stats)){
    const r=st.r||[];
    if(st.mUntil || (r.length>=3 && r.slice(-3).every(x=>x.ok))) s.add(key(t));
  }
  getHundred(lang).past.flat().forEach(t=>s.add(key(t)));
  for(const L of climbSlots(lang)){
    L.removed.forEach(i=>{ const w=L.list[i]; if(w) s.add(key(w.t)); });
    (L.comp||[]).flat().forEach(t=>s.add(key(t)));
  }
  s.delete('');
  return s.size;
}
function cefrStatus(n){
  let level='—', next=CEFR_LEVELS[0];
  for(const [th,name] of CEFR_LEVELS){
    if(n>=th) level=name;
  }
  next=CEFR_LEVELS.find(([th])=>n<th)||null;
  return {level, next};
}

      b.onclick=()=>{ state.ipLang=l; state.iq=null; state.screen='idioms'; render(); };
      ic.querySelector('#idiomRow').appendChild(b);
    }
    app.appendChild(ic);
  }
  if(IP_LANGS.some(l=>phraseTopics(l).length)){
    const pc = $(`<div class="card" style="margin-top:16px"><h2 style="margin-top:0">💬 Useful Phrases <span class="pill">10 phrases per quiz — pick the subject</span></h2><div class="row" id="phraseRow"></div></div>`);
    for(const l of IP_LANGS){
      const tps=phraseTopics(l); if(!tps.length) continue;
      const dd=DATA[l];
      const n=tps.reduce((s,t)=>s+t.items.length,0);
      const b=$(`<button style="flex:1;min-width:200px;padding:14px">${dd.flag} ${dd.name}<br><span class="pill">${tps.length} subjects · ${n} phrases</span></button>`);
      b.onclick=()=>{ state.ipLang=l; state.pq=null; state.screen='phrases'; render(); };
      pc.querySelector('#phraseRow').appendChild(b);
    }
    app.appendChild(pc);
  }
  const nCustom = getCustom().words.length;
  const mw = $(`<button style="margin-top:14px">📝 My Words — add your own vocabulary${nCustom?` (${nCustom})`:''}</button>`);
  mw.onclick=()=>{ state.mwBack='home'; state.screen='mywords'; render(); };
  app.appendChild(mw);
  const note = window.speechSynthesis
    ? `<div class="voiceNote">🔊 Audio uses your browser's built-in voices (German, Italian, Dutch). If a word sounds wrong or silent, make sure you're online — Chrome and Edge stream their best voices. Browsers ship no Irish voice, so Irish audio is disabled.</div>`
    : `<div class="voiceNote">⚠️ This browser does not support speech synthesis — audio features will be disabled.</div>`;
  app.appendChild($(note));
}

// ---------- setup ----------
function renderSetup(){
  const d = langData();
  const learned = getLearned(state.lang);
  app.appendChild($(`<div class="topnav"><span class="backlink" id="back">← Languages</span>
    <span><button class="small" id="mwBtn">📝 My Words</button>
    <button class="small" id="mgrBtn">✓ Learned words (${learned.size})</button></span></div>`));
  app.querySelector('#back').onclick=()=>{ state.screen='home'; render(); };
  app.querySelector('#mgrBtn').onclick=()=>{ state.screen='learned'; render(); };
  app.querySelector('#mwBtn').onclick=()=>{ state.mwBack='setup'; state.screen='mywords'; render(); };

  app.appendChild($(`<h1>${d.flag} ${d.name}</h1>`));
  app.appendChild($(`<div class="sub">Choose quiz type, then tick the units you want. Ticking several units combines their material into one quiz.</div>`));

  // quiz type
  const typeCard = $(`<div class="card"><h2 style="margin-top:0">1 · Quiz type</h2><div class="opts" id="types"></div><div class="opts" id="modes"></div></div>`);
  app.appendChild(typeCard);
  const types = [ ['vocab','📖 Vocabulary'], ['grammar','✏️ Grammar'], ['conj','🔤 Conjugation & tables'] ];
  for(const [val,lbl] of types){
    const o = $(`<div class="opt ${state.quizType===val?'sel':''}">${lbl}</div>`);
    o.onclick=()=>{ state.quizType=val; render(); };
    typeCard.querySelector('#types').appendChild(o);
  }
  if(state.quizType==='vocab'){
    const voiceOK = hasVoice(d.ttsLang);
    if(!voiceOK && state.vocabMode==='listen') state.vocabMode='toEN';
    const modes = [ ['toEN', d.name+' → English'], ['fromEN','English → '+d.name], ['listen','🔊 Listening (audio only)'], ['type','⌨️ Type the '+d.name+' word'] ];
    for(const [val,lbl] of modes){
      const o = $(`<div class="opt ${state.vocabMode===val?'sel':''}">${lbl}</div>`);
      if(val==='listen' && !voiceOK){ o.style.opacity='.35'; o.style.cursor='not-allowed'; o.title='No '+d.name+' voice in this browser'; }
      else o.onclick=()=>{ state.vocabMode=val; render(); };
      typeCard.querySelector('#modes').appendChild(o);
    }
    if(!voiceOK) typeCard.appendChild($(`<div class="voiceNote">🔇 This browser has no ${d.name} voice, so audio and the Listening mode are disabled for ${d.name}.</div>`));
  }

  // units
  const unitCard = $(`<div class="card"><h2 style="margin-top:0">2 · Material <span class="pill">from your course sections</span></h2></div>`);
  app.appendChild(unitCard);
  const sections = [...d.courses];
  if(state.quizType==='vocab'){
    const cu = customUnitsFor(state.lang);
    if(cu.length) sections.push({ title:'📝 My Words (your custom vocabulary)', units: cu });
  }
  if(!state.openCourses) state.openCourses = null; // per-language default computed below
  const openKey = state.lang + '|' + state.quizType;
  if(!state._open) state._open = {};
  if(!state._open[openKey]){
    state._open[openKey] = new Set(sections.filter(c=>!(c.id||'').startsWith('duo_')).map(c=>c.title));
  }
  const openSet = state._open[openKey];
  for(const c of sections){
    const units = c.units.filter(u=>u.type===state.quizType);
    if(!units.length) continue;
    const isOpen = openSet.has(c.title);
    const nSel = units.filter(u=>state.selectedUnits.has(u.id)).length;
    const head = $(`<div class="courseHead" style="cursor:pointer"><h3>${isOpen?'▾':'▸'} ${c.title} <span class="pill">${units.length} units${nSel?` · ${nSel} ticked`:''}</span></h3><span>
      <button class="small selAll">all</button> <button class="small selNone">none</button></span></div>`);
    unitCard.appendChild(head);
    head.querySelector('h3').onclick=()=>{ isOpen?openSet.delete(c.title):openSet.add(c.title); render(); };
    head.querySelector('.selAll').onclick=(e)=>{ e.stopPropagation(); units.forEach(u=>state.selectedUnits.add(u.id)); saveSel(); render(); };
    head.querySelector('.selNone').onclick=(e)=>{ e.stopPropagation(); units.forEach(u=>state.selectedUnits.delete(u.id)); saveSel(); render(); };
    if(!isOpen) continue;
    for(const u of units){
      let cnt, cntTxt;
      if(u.type==='vocab'){
        cnt = availableVocab(u, learned).length;
        const excl = u.items.length - cnt;
        cntTxt = `${cnt} words${excl?` <span class="learnedTag">(${excl} learned)</span>`:``}`;
      } else if(u.type==='conj'){ cnt = u.items.length; cntTxt = `${cnt} ${u.items.some(it=>it.rows)?'tables':'verbs'}`; }
      else { cnt = u.items.length; cntTxt = `${cnt} questions`; }
      const row = $(`<div class="unit"><input type="checkbox" id="cb_${u.id}" ${state.selectedUnits.has(u.id)?'checked':''}>
        <label for="cb_${u.id}">${u.title.replace(/^(Vocab|Grammar|Conjugate|Tables|My Words)[^:]*:\s*/,'')}</label><span class="cnt">${cntTxt}</span></div>`);
      row.querySelector('input').onchange=(e)=>{
        if(e.target.checked) state.selectedUnits.add(u.id); else state.selectedUnits.delete(u.id);
        saveSel(); updateStartBar();
      };
      unitCard.appendChild(row);
    }
  }

  // length
  const lenCard = $(`<div class="card"><h2 style="margin-top:0">3 · Quiz length</h2><div class="opts" id="lens"></div></div>`);
  app.appendChild(lenCard);
  for(const [val,lbl] of [[10,'10'],[15,'15'],[25,'25'],[9999,'Everything selected']]){
    const o = $(`<div class="opt ${state.qCount===val?'sel':''}">${lbl}</div>`);
    o.onclick=()=>{ state.qCount=val; render(); };
    lenCard.querySelector('#lens').appendChild(o);
  }

  // start bar
  const bar = $(`<div class="startBar"><div class="info" id="startInfo"></div><button class="primary" id="startBtn">Start quiz ▶</button></div>`);
  app.appendChild(bar);
  bar.querySelector('#startBtn').onclick=startQuiz;
  updateStartBar();

  function updateStartBar(){
    const pool = buildPool();
    const info = app.querySelector('#startInfo');
    const btn = app.querySelector('#startBtn');
    if(!pool.length){ info.textContent = 'Select at least one unit with material remaining.'; btn.disabled=true; }
    else{
      const n = Math.min(state.qCount, pool.length);
      const noun = state.quizType==='vocab'?'words':state.quizType==='conj'?'verbs':'questions';
      info.textContent = `${pool.length} ${noun} available → quiz of ${n}`;
      btn.disabled=false;
    }
  }
}

function buildPool(){
  const learned = getLearned(state.lang);
  const pool=[];
  for(const id of state.selectedUnits){
    const u = unitById(id);
    if(!u || u.type!==state.quizType) continue;
    if(u.type==='vocab') for(const it of availableVocab(u,learned)) pool.push({unit:u, item:it});
    else for(const it of u.items) pool.push({unit:u, item:it});
  }
  return pool;
}

// ---------- quiz building ----------
function startQuiz(){
  const pool = buildPool();
  if(!pool.length) return;
  const picked = shuffle(pool).slice(0, Math.min(state.qCount, pool.length));
  let questions;
  if(state.quizType==='vocab'){
    // distractors drawn from the full selected pool (fall back to whole language)
    const allItems = pool.map(p=>p.item);
    const globalItems = allUnits().filter(u=>u.type==='vocab').flatMap(u=>u.items);
    questions = picked.map(p=>{
      const mode = state.vocabMode;
      const correct = p.item;
      if(mode==='type'){
        return { kind:'vocab', mode, item:correct, unit:p.unit, prompt: correct.e, choices:[], answer: correct.t };
      }
      const distractorSrc = (allItems.length>=8?allItems:globalItems).filter(it=>it.t!==correct.t);
      const ds = shuffle(distractorSrc).slice(0,3);
      const answerField = (mode==='fromEN') ? 't' : 'e';
      const choices = shuffle([correct, ...ds]).map(it=>it[answerField]);
      return { kind:'vocab', mode, item:correct, unit:p.unit,
        prompt: mode==='fromEN' ? correct.e : correct.t,
        choices, answer: correct[answerField] };
    });
  } else if(state.quizType==='conj'){
    questions = picked.map(p=>({ kind:'conj', item:p.item, unit:p.unit, prompt:p.item.inf, choices:[], answer:p.item.forms.join(', ') }));
  } else {
    questions = picked.map(p=>{
      const it = p.item;
      const correctText = it.c[it.a];
      const choices = shuffle(it.c);
      return { kind:'grammar', item:it, unit:p.unit, prompt: it.q, choices, answer: correctText, expl: it.x, ex: it.ex, tr: it.tr };
    });
  }
  state.quiz = { questions, idx:0, correct:0, missed:[], answered:false };
  state.screen='quiz'; render();
}

// ---------- quiz screen ----------
function renderQuiz(){
  const qz = state.quiz;
  const q = qz.questions[qz.idx];
  const d = langData();
  app.appendChild($(`<div class="topnav"><span class="backlink" id="quit">✕ Quit quiz</span>
    <span style="color:var(--muted);font-size:.9rem">${d.flag} ${state.quizType==='vocab'?'Vocabulary':state.quizType==='conj'?'Conjugation':'Grammar'}</span></div>`));
  app.querySelector('#quit').onclick=()=>{ if(confirm('Quit this quiz?')){ state.screen='setup'; render(); } };

  app.appendChild($(`<div class="qTop"><span>Question ${qz.idx+1} / ${qz.questions.length}</span><span>Score: ${qz.correct}</span></div>`));
  const bar = $(`<div class="barOuter"><div class="barInner"></div></div>`);
  bar.firstElementChild.style.width = (qz.idx/qz.questions.length*100)+'%';
  app.appendChild(bar);

  const card = $(`<div class="card"></div>`);
  app.appendChild(card);

  if(q.kind==='vocab'){
    const listen = q.mode==='listen';
    if(listen){
      card.appendChild($(`<div class="qWord">🔊 …</div>`));
      card.appendChild($(`<div class="qHint">Listen and choose the English meaning</div>`));
    } else if(q.mode==='type'){
      card.appendChild($(`<div class="qWord">${nounPrompt(maskPrompt(q.prompt, q.answer, state.lang), q.answer)}</div>`));
      card.appendChild($(`<div class="qHint">${state.lang==='japanese' ? 'Type the Japanese word in romaji — it converts to hiragana as you type (mizu = みず)' : `Type the ${d.name} word — accents optional (uber = über); nouns need their article (die Tür)${CTRL_HINT[state.lang]||''}`}</div>`));
    } else {
      card.appendChild($(`<div class="qWord">${q.mode==='fromEN' ? nounPrompt(maskPrompt(q.prompt, q.answer, state.lang), q.answer) : jpDisp(q.prompt)}</div>`));
      card.appendChild($(`<div class="qHint">${q.mode==='fromEN' ? 'Choose the '+d.name+' translation' : 'Choose the English meaning'}</div>`));
    }
    if(window.speechSynthesis && q.mode!=='fromEN' && q.mode!=='type'){
      const sp = $(`<button class="speakBtn" title="Play audio">🔊</button>`);
      sp.onclick=()=>speak(q.item.t, d.ttsLang);
      card.appendChild(sp);
      setTimeout(()=>speak(q.item.t, d.ttsLang), 250);
    }
  } else if(q.kind==='conj'){
    let hintTxt;
    if(q.item.rows){
      hintTxt = 'fill in every form';
    } else {
      const exPron = PRON[state.lang][0].length ? PRON[state.lang][0][0]+' + verb ('+PRON[state.lang][0][0]+' '+q.item.forms[0].split('/')[0]+')' : q.item.forms[0].split('/')[0];
      hintTxt = 'type pronoun + verb form for each person (e.g. '+exPron+')';
    }
    card.appendChild($(`<div class="qWord">${q.item.inf}</div>`));
    card.appendChild($(`<div class="qHint">${q.item.en} · <b>${q.unit.tense}</b> — ${hintTxt}</div>`));
    if(window.speechSynthesis){
      const sp = $(`<button class="speakBtn" title="Hear the infinitive">🔊</button>`);
      sp.onclick=()=>speak(q.item.inf, d.ttsLang);
      card.appendChild(sp);
    }
  } else {
    card.appendChild($(`<div class="qWord" style="font-size:1.25rem; line-height:1.5">${q.prompt}</div>`));
    card.appendChild($(`<div class="qHint">${q.unit.title.replace(/^Grammar[^:]*:\s*/,'')}</div>`));
    if(q.unit.lesson) card.appendChild($(`<details style="max-width:640px;margin:6px auto 4px;color:var(--muted)"><summary style="cursor:pointer;font-size:.9rem">📖 Review the lesson</summary><div style="text-align:left;line-height:1.6;margin-top:8px">${q.unit.lesson.replace(/\n/g,'<br>')}</div></details>`));
  }

  const ch = $(`<div class="choices ${q.kind==='vocab'?'two':''}"></div>`);
  card.appendChild(ch);
  if(q.kind==='conj'){
    const persons = q.item.rows || PERSONS_EN[state.lang];
    const wrapC = $(`<div style="max-width:520px;margin:0 auto"></div>`);
    const inputs = [];
    let lastInput = null;
    persons.forEach((p,i)=>{
      const row = $(`<div style="display:flex;align-items:center;gap:10px;margin:6px 0"></div>`);
      row.appendChild($(`<span style="width:118px;text-align:right;color:var(--muted);font-size:.92rem;flex-shrink:0">${p}</span>`));
      const inp = $(`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;min-width:0;padding:9px 12px;font-size:1rem;border-radius:8px;border:2px solid var(--border);background:var(--card);color:var(--text);outline:none">`);
      inp.addEventListener('focus',()=>{ lastInput=inp; });
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter'){
          e.preventDefault(); e.__consumed=true; window.__enterTs=Date.now();
          // Enter = Check all once every cell is filled; otherwise jump to the
          // next empty cell (wrapping), so Enter and the button always agree
          if(inputs.every(x=>x.value.trim())){ doCheck(); return; }
          const after = inputs.slice(i+1).find(x=>!x.value.trim());
          const before = inputs.slice(0,i+1).find(x=>!x.value.trim());
          const nxt = after || before || (i<persons.length-1 ? inputs[i+1] : null);
          if(nxt) nxt.focus();
        }
      });
      const mark = $(`<span style="width:22px;flex-shrink:0"></span>`);
      row.appendChild(inp); row.appendChild(mark);
      inputs.push(inp); inp._mark = mark;
      wrapC.appendChild(row);
    });
    const accRow = $(`<div style="display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap"></div>`);
    (ACCENTS[state.lang]||[]).forEach(chr=>{
      const b = $(`<button class="small" style="min-width:38px;font-size:1.05rem">${chr}</button>`);
      const cb=comboFor(state.lang,chr); if(cb) b.title=cb;
      b.onclick=()=>{ const inp=lastInput||inputs[0]; const s=inp.selectionStart||inp.value.length; inp.value=inp.value.slice(0,s)+chr+inp.value.slice(inp.selectionEnd||s); inp.focus(); inp.setSelectionRange(s+1,s+1); };
      accRow.appendChild(b);
    });
    const go = $(`<button class="primary" style="display:block;margin:6px auto 0">Check all</button>`);
    function doCheck(){
      if(qz.answered) return;
      qz.answered=true;
      let nRight=0;
      const plain = !!q.item.rows;
      q.item.forms.forEach((f,i)=>{
        const typed = inputs[i].value;
        const ok = conjRowOk(state.lang, i, typed, f, plain);
        const canon = conjCanon(state.lang, i, f, plain);
        inputs[i].disabled=true;
        inputs[i].style.borderColor = ok ? 'var(--good)' : 'var(--bad)';
        inputs[i]._mark.textContent = ok ? '✓' : '✗';
        inputs[i]._mark.style.color = ok ? 'var(--good)' : 'var(--bad)';
        const canonFirst = (!plain && (PRON[state.lang][i]||[])[0] ? PRON[state.lang][i][0]+' ' : '') + f.split('/')[0].trim();
        if(!ok || typed.trim().toLowerCase()!==canonFirst.toLowerCase()){
          const hint = $(`<span style="color:${ok?'var(--muted)':'var(--good)'};font-size:.9rem;white-space:nowrap">${canon}</span>`);
          inputs[i].parentElement.appendChild(hint);
        }
        if(ok) nRight++;
      });
      const all = nRight===q.item.forms.length;
      if(all) qz.correct++; else qz.missed.push(q);
      go.style.display='none';
      const fb = $(`<div class="feedback"></div>`);
      fb.appendChild($(`<div style="font-weight:600; color:${all?'var(--good)':nRight>0?'var(--warn)':'var(--bad)'}">${all?'✔ Perfect — all '+nRight+' forms correct!':nRight+' / '+q.item.forms.length+' forms correct'}</div>`));
      if(window.speechSynthesis){
        const hear = $(`<button class="small" style="margin-top:8px">🔊 Hear the full conjugation</button>`);
        hear.onclick=()=>speak(conjSpeakText(state.lang, q.item), d.ttsLang);
        fb.appendChild(hear);
      }
      const next = $(`<button class="primary" style="margin-top:12px">${qz.idx+1<qz.questions.length?'Next →':'Finish'}</button>`);
      next.onclick=()=>{
        qz.answered=false;
        if(qz.idx+1<qz.questions.length){ qz.idx++; render(); }
        else { state.screen='result'; render(); }
      };
      fb.appendChild(next);
      card.appendChild(fb);
      next.focus();
    }
    go.onclick=doCheck;
    wrapC.appendChild(accRow); wrapC.appendChild(go);
    card.appendChild(wrapC);
    setTimeout(()=>inputs[0].focus(),50);
  } else if(q.kind==='vocab' && q.mode==='type'){
    const wrapT = $(`<div style="max-width:560px;margin:0 auto;text-align:center"></div>`);
    const inp = $(`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;padding:14px 16px;font-size:1.1rem;border-radius:10px;border:2px solid var(--border);background:var(--card);color:var(--text);outline:none" placeholder="Type here…">`);
    jpBind(inp, state.lang);
    const accRow = $(`<div style="display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap"></div>`);
    (ACCENTS[state.lang]||[]).forEach(chr=>{
      const b = $(`<button class="small" style="min-width:38px;font-size:1.05rem">${chr}</button>`);
      const cb=comboFor(state.lang,chr); if(cb) b.title=cb;
      b.onclick=()=>{ const s=inp.selectionStart||inp.value.length; inp.value=inp.value.slice(0,s)+chr+inp.value.slice(inp.selectionEnd||s); inp.focus(); inp.setSelectionRange(s+1,s+1); };
      accRow.appendChild(b);
    });
    const go = $(`<button class="primary" style="margin-top:4px">Check</button>`);
    const doCheck=()=>{
      if(qz.answered) return;
      const typed = inp.value;
      const right = vocabAnswerOk(typed, q.answer);
      const artMiss = !right && answerMatches(typed, q.answer);
      const exact = typed.trim().toLowerCase()===q.answer.toLowerCase();
      inp.disabled=true; go.style.display='none';
      typedFeedback(right, exact, typed, artMiss);
    };
    go.onclick=doCheck;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); e.__consumed=true; window.__enterTs=Date.now(); doCheck(); } });
    wrapT.appendChild(inp); wrapT.appendChild(accRow); wrapT.appendChild(go);
    card.appendChild(wrapT);
    setTimeout(()=>inp.focus(),50);
  } else {
    q.choices.forEach(c=>{
      const b = $(`<button class="choice"></button>`);
      // English-gloss choices can leak the prompted word inside parens too
      b.textContent = (q.kind==='vocab' && q.mode!=='fromEN') ? maskPrompt(c, q.item.t, state.lang) : c;
      b._val = c;
      b.onclick=()=>answer(b, c);
      ch.appendChild(b);
    });
  }

  function typedFeedback(right, exact, typed, artMiss){
    qz.answered=true;
    if(right) qz.correct++; else qz.missed.push(q);
    const fb = $(`<div class="feedback"></div>`);
    let head;
    if(right && exact) head = `✔ Correct!`;
    else if(right) head = `✔ Correct — full spelling: “${jpDisp(q.answer)}”`;
    else if(artMiss) head = `✘ Right word, but the article (gender) is wrong or missing — it's “${q.answer}”`;
    else head = `✘ Not quite — it's “${jpDisp(q.answer)}”`;
    fb.appendChild($(`<div style="font-weight:600; color:${right?'var(--good)':'var(--bad)'}">${head}</div>`));
    fb.appendChild($(`<div class="expl">${jpDisp(q.item.t)} = ${q.item.e}${pluralNote(state.lang, q.item.t)}</div>`));
    if(window.speechSynthesis) speak(q.item.t, d.ttsLang);
    const learned = getLearned(state.lang);
    if(!learned.has(vocabId(q.item))){
      const lb = $(`<button class="small" style="margin-top:8px">✓ I know this — exclude from future quizzes</button>`);
      lb.onclick=()=>{ const s=getLearned(state.lang); s.add(vocabId(q.item)); saveLearned(state.lang,s); lb.textContent='✓ Marked as learned'; lb.disabled=true; };
      fb.appendChild(lb);
    }
    const next = $(`<button class="primary" style="margin-top:12px">${qz.idx+1<qz.questions.length?'Next →':'Finish'}</button>`);
    next.onclick=()=>{
      qz.answered=false;
      if(qz.idx+1<qz.questions.length){ qz.idx++; render(); }
      else { state.screen='result'; render(); }
    };
    fb.appendChild(next);
    card.appendChild(fb);
    next.focus();
  }

  function answer(btn, chosen){
    if(qz.answered) return;
    qz.answered=true;
    const right = chosen===q.answer;
    if(right) qz.correct++;
    else qz.missed.push(q);
    [...ch.children].forEach(b=>{
      if((b._val!==undefined?b._val:b.textContent)===q.answer) b.classList.add('correct');
      else if(b===btn) b.classList.add('wrong');
      b.style.pointerEvents='none';
    });
    const fb = $(`<div class="feedback"></div>`);
    fb.appendChild($(`<div style="font-weight:600; color:${right?'var(--good)':'var(--bad)'}">${right?'✔ Correct!':'✘ Not quite — it\'s “'+q.answer+'”'}</div>`));
    if(q.kind==='grammar'){
      const fs = fullSentence(q.prompt, q.answer);
      if(fs) fb.appendChild($(`<div class="expl" style="font-size:1.05rem">${fs}</div>`));
    }
    if(q.kind==='grammar' && q.expl) fb.appendChild($(`<div class="expl">${q.expl}</div>`));
    if(q.kind==='grammar' && q.ex) fb.appendChild($(`<div class="expl" style="font-size:1.05rem">${q.ex}</div>`));
    if(q.kind==='grammar' && q.tr) fb.appendChild($(`<div class="expl" style="font-style:italic">🇬🇧 “${q.tr}”</div>`));
    if(q.kind==='grammar'){
      const wg = wordGlossNote(state.lang, q.answer);
      if(wg) fb.appendChild($(`<div class="expl" style="color:var(--muted)">${wg}</div>`));
    }
    if(q.kind==='vocab'){
      fb.appendChild($(`<div class="expl">${q.item.t} = ${q.item.e}${pluralNote(state.lang, q.item.t)}</div>`));
      // speak the word after answering in EN->target mode
      if(window.speechSynthesis && q.mode==='fromEN') speak(q.item.t, d.ttsLang);
      const learned = getLearned(state.lang);
      if(!learned.has(vocabId(q.item))){
        const lb = $(`<button class="small" style="margin-top:8px">✓ I know this — exclude from future quizzes</button>`);
        lb.onclick=()=>{ const s=getLearned(state.lang); s.add(vocabId(q.item)); saveLearned(state.lang,s); lb.textContent='✓ Marked as learned'; lb.disabled=true; };
        fb.appendChild(lb);
      }
    }
    const next = $(`<button class="primary" style="margin-top:12px">${qz.idx+1<qz.questions.length?'Next →':'Finish'}</button>`);
    next.onclick=()=>{
      qz.answered=false;
      if(qz.idx+1<qz.questions.length){ qz.idx++; render(); }
      else { state.screen='result'; render(); }
    };
    fb.appendChild(next);
    card.appendChild(fb);
    next.focus();
  }
}

// ---------- Daily Exercise (German & Italian) ----------
const DAILY_LANGS = ['german','italian','spanish'];
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(ds,n){ const [y,m,dd]=ds.split('-').map(Number); const d=new Date(y,m-1,dd+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getDaily(lang){ try{ const o=JSON.parse(localStorage.getItem('lq_daily_'+lang)||'null')||{}; return {days:o.days||{}, stats:o.stats||{}, cursor:o.cursor||0}; }catch(e){ return {days:{},stats:{},cursor:0}; } }
function saveDaily(lang,D){ localStorage.setItem('lq_daily_'+lang, JSON.stringify(D)); }
function duoFlat(lang){ const c=DATA[lang].courses.find(c=>c.id.startsWith('duo_')); return c ? c.units.flatMap(u=>u.items) : []; }
function grammarUnitsFor(lang){ return DATA[lang].courses.flatMap(c=>c.units).filter(u=>u.type==='grammar'); }
function gUnitById(lang,id){ return DATA[lang].courses.flatMap(c=>c.units).find(u=>u.id===id); }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function seededPick(n,k,seed){ const idx=[...Array(n).keys()]; let s=seed||1; for(let i=idx.length-1;i>0;i--){ s=(Math.imul(s,1103515245)+12345)>>>0; const j=s%(i+1); const tmp=idx[i]; idx[i]=idx[j]; idx[j]=tmp; } return idx.slice(0,k); }
function wordRate(s){ const r=s.r||[]; return r.length ? r.reduce((a,x)=>a+x.ok,0)/r.length : 0; }
function isMastered(s,dateStr){ return !!(s && s.mUntil && dateStr < s.mUntil); }

// Quiz-size settings (shared by both languages): vocab & grammar question counts.
function getDailyCfg(){ try{ return Object.assign({v:10,g:5}, JSON.parse(localStorage.getItem('lq_daily_cfg')||'{}')); }catch(e){ return {v:10,g:5}; } }
function saveDailyCfg(c){ localStorage.setItem('lq_daily_cfg', JSON.stringify(c)); }
function sessN(k){ const m=k.match(/#(\d+)$/); return m?+m[1]:1; }
function todaySessions(D){ const t=todayStr(); return Object.keys(D.days).filter(k=>k===t||k.startsWith(t+'#')).sort((a,b)=>sessN(a)-sessN(b)); }
// Grammar questions for a session: start at the rotating concept for this quiz
// number and spill into the following concept(s) if the configured count exceeds
// one unit's questions. Stored as [{u:unitId, i:questionIndex}, ...].
// Rule-first ordering: lead with a question that states the concept's rule
// (no blank in the question), then follow with application questions that put
// the rule into effect (fill-in-the-blank sentences).
function pickGrammar(lang, dayNum, count, seedStr){
  const gunits=grammarUnitsFor(lang);
  const out=[]; let ui=(dayNum-1)%gunits.length, hop=0;
  while(out.length<count && hop<gunits.length){
    const gu=gunits[ui%gunits.length];
    const rule=[], app=[];
    gu.items.forEach((it,i)=>((it.q.includes('___')?app:rule).push(i)));
    const sr=seededPick(rule.length, rule.length, hashStr(seedStr+gu.id+'r')).map(x=>rule[x]);
    let sa=seededPick(app.length, app.length, hashStr(seedStr+gu.id+'a')).map(x=>app[x]);
    // the questions right after a rule question should exercise THAT rule:
    // rank the unit's fill-ins by keyword overlap with the leading rule item
    if(sr.length && sa.length){
      const STOPW=new Set(['which','what','with','that','this','from','when','does','goes','only','always','after','before','into','take','takes','sentence','correct','answer','form','word','words']);
      const tok=it=>new Set(foldTxt(it.q+' '+(it.c||[]).join(' ')+' '+(it.x||'')).split(' ').filter(w=>w.length>=4&&!STOPW.has(w)));
      const lead=tok(gu.items[sr[0]]);
      const score=i=>{ let n=0; for(const w of tok(gu.items[i])) if(lead.has(w)) n++; return n; };
      sa=sa.map((i,j)=>[i,score(i),j]).sort((a,b)=>b[1]-a[1]||a[2]-b[2]).map(x=>x[0]);
    }
    const remaining=count-out.length;
    const nRule=Math.min(sr.length, Math.max(1, Math.floor(remaining/4)));
    const order=[...sr.slice(0,nRule), ...sa, ...sr.slice(nRule)];
    for(const i of order){ if(out.length>=count) break; out.push({u:gu.id, i}); }
    ui++; hop++;
  }
  return out;
}
// Refresh stored daily words from the current course data, so article/gloss
// improvements reach quizzes that were already built; per-word stats migrate
// with the renamed word (matched ignoring article and accents).
function migrateDaily(lang){
  const D=getDaily(lang);
  if(!Object.keys(D.days).length) return;
  const map=new Map();
  for(const it of duoFlat(lang)){
    const k=stripArticle(foldTxt(it.t));
    if(k && !map.has(k)) map.set(k, it);
  }
  let changed=false;
  for(const key of Object.keys(D.days)){
    for(const w of (D.days[key].words||[])){
      const cur=map.get(stripArticle(foldTxt(w.t)));
      if(!cur) continue;
      if(cur.t!==w.t){
        if(D.stats[w.t] && !D.stats[cur.t]){ D.stats[cur.t]=D.stats[w.t]; delete D.stats[w.t]; }
        else if(D.stats[w.t] && D.stats[cur.t]){ D.stats[cur.t].r=[...D.stats[w.t].r, ...D.stats[cur.t].r]; delete D.stats[w.t]; }
        const wo=D.days[key].wOk;
        if(wo && (w.t in wo) && !(cur.t in wo)){ wo[cur.t]=wo[w.t]; delete wo[w.t]; }
        w.t=cur.t; changed=true;
      }
      if(cur.e && cur.e!==w.e){ w.e=cur.e; changed=true; }
    }
  }
  for(const [t,s] of Object.entries(D.stats)){
    const cur=map.get(stripArticle(foldTxt(t)));
    if(cur && cur.e && s.e!==cur.e){ s.e=cur.e; changed=true; }
  }
  if(changed) saveDaily(lang,D);
}
// Build (or return) the latest quiz session. Selection: first 10 sessions all-new
// words walking the Duolingo path in order; afterwards at least 40% review words
// (lowest success rate first). Mastered words (3 consecutive correct first tries)
// are excluded for 30 days. forceNew=true starts an additional session today.
function buildDailySession(lang, forceNew){
  migrateDaily(lang);
  const D=getDaily(lang); const t=todayStr();
  const todays=todaySessions(D);
  if(!forceNew && todays.length) return D.days[todays[todays.length-1]];
  const key = todays.length ? t+'#'+(todays.length+1) : t;
  if(D.days[key]) return D.days[key];
  const cfg=getDailyCfg();
  const all=duoFlat(lang);
  const dayNum=Object.keys(D.days).length+1;
  const learned=getLearned(lang);
  let review=[];
  if(dayNum>10){
    const revTarget=Math.ceil(cfg.v*0.4);
    // Words NEVER answered correctly on the previous quiz day (across every
    // attempt, retakes included) must come back on this quiz — ahead of, and
    // if necessary beyond, the normal 40% review quota.
    const prevKeys=Object.keys(D.days).sort((a,b)=>(D.days[a].day||0)-(D.days[b].day||0));
    const prev=prevKeys.length?D.days[prevKeys[prevKeys.length-1]]:null;
    let carry=[];
    if(prev){
      const missed = prev.wOk
        ? Object.keys(prev.wOk).filter(w=>!prev.wOk[w])
        // older records have no per-attempt map: fall back to first-try misses
        : (prev.words||[]).filter(w=>{ const s=D.stats[w.t]; const e=((s&&s.r)||[]).filter(x=>x.d===prev.date);
            return e.length&&!e[e.length-1].ok; }).map(w=>w.t);
      carry = missed.filter(w=>!learned.has(w)).slice(0,cfg.v)
        .map(w=>({t:w, e:(D.stats[w]&&D.stats[w].e)||((prev.words||[]).find(x=>x.t===w)||{}).e||'', review:true}));
    }
    const carrySet=new Set(carry.map(x=>x.t));
    review=carry.concat(Object.entries(D.stats)
      .filter(([w,s])=>!carrySet.has(w)&&!isMastered(s,t))
      .sort((a,b)=>{ const ra=wordRate(a[1]), rb=wordRate(b[1]); if(ra!==rb) return ra-rb;
        const la=(a[1].r[a[1].r.length-1]||{}).d||'', lb=(b[1].r[b[1].r.length-1]||{}).d||'';
        return la<lb?-1:la>lb?1:0; })
      .slice(0,Math.max(0,revTarget-carry.length)).map(([w,s])=>({t:w, e:s.e, review:true})));
  }
  const have=new Set(review.map(x=>x.t));
  const testedSet=new Set(Object.keys(D.stats));
  // words already used by a current or past 100-Word Quiz are NOT new — the
  // 100-word quiz walks the same Duolingo path, so without this the daily's
  // "new" words repeat what that quiz just tested
  const hundredUsed=new Set();
  { const HH=getHundred(lang);
    for(const t of [...HH.list.map(x=>x.t), ...HH.past.flat()]) hundredUsed.add(stripArticle(foldTxt(t)));
    for(const LL of climbSlots(lang))
      for(const t of [...LL.tested, ...LL.past.flat()]) hundredUsed.add(stripArticle(foldTxt(t))); }
  const news=[]; let cur=D.cursor;
  while(review.length+news.length<cfg.v && cur<all.length){
    const it=all[cur]; cur++;
    if(!it||!it.t||!it.e) continue;
    if(testedSet.has(it.t)||learned.has(it.t)||have.has(it.t)) continue;
    if(hundredUsed.has(stripArticle(foldTxt(it.t)))) continue;
    have.add(it.t); news.push({t:it.t, e:it.e, review:false});
  }
  D.cursor=cur;
  if(review.length+news.length<cfg.v){
    for(const [w,s] of Object.entries(D.stats)){
      if(review.length+news.length>=cfg.v) break;
      if(!have.has(w)&&!isMastered(s,t)){ have.add(w); review.push({t:w,e:s.e,review:true}); }
    }
  }
  const gQs=pickGrammar(lang, dayNum, cfg.g, t+lang+key);
  const rec={key, date:t, day:dayNum, sess:sessN(key), words:[...review,...news], gQs, attempts:[], best:0};
  D.days[key]=rec; saveDaily(lang,D);
  return rec;
}
// Back-compat: sessions built before the size/extra-session update stored gUnit+gIdx.
function sessionGrammar(lang, rec){
  const list = rec.gQs ? rec.gQs : rec.gIdx.map(i=>({u:rec.gUnit, i}));
  return list.map(({u,i})=>({unit:gUnitById(lang,u), q:gUnitById(lang,u).items[i]}));
}
// Record a finished attempt. Only the FIRST attempt of the day feeds the per-word
// history and mastery (retakes chase 100% but don't inflate the stats).
function recordDailyAttempt(lang, key, perWord, gOk, gTot){
  const D=getDaily(lang); const day=D.days[key]; if(!day) return {pct:0,first:false};
  const dateStr=day.date||key;
  const v=perWord.filter(x=>x.ok).length;
  const first=day.attempts.length===0;
  const pct=Math.round(100*(v+gOk)/(perWord.length+gTot));
  day.attempts.push({when:new Date().toISOString(), v, vt:perWord.length, g:gOk, gt:gTot, pct});
  day.best=Math.max(day.best||0,pct);
  // ever-correct-today map (every attempt counts): feeds next-day carry-over
  day.wOk = day.wOk || {};
  for(const pw of perWord){ if(pw.ok) day.wOk[pw.t]=1; else if(!(pw.t in day.wOk)) day.wOk[pw.t]=0; }
  if(first){
    for(const pw of perWord){
      const s=D.stats[pw.t]=D.stats[pw.t]||{r:[],mUntil:null,e:pw.e};
      s.e=s.e||pw.e;
      s.r.push({d:dateStr, ok:pw.ok?1:0});
      const l3=s.r.slice(-3);
      if(l3.length===3 && l3.every(x=>x.ok)) s.mUntil=addDays(dateStr,30);
      else if(!pw.ok) s.mUntil=null;
    }
  }
  saveDaily(lang,D);
  return {pct, first};
}

function startDailyRun(lang, srec){
  state.dq={ rec:srec, lang, vSeq:shuffle([...srec.words]), gSeq:sessionGrammar(lang,srec),
    idx:0, phase:'v', vRes:[], gOk:0, done:false };
  render();
}
function renderDaily(){
  const lang=state.dailyLang, d=DATA[lang];
  if(!duoFlat(lang).length){ app.appendChild($(`<div class="card">Duolingo course data missing for ${d.name}.</div>`)); return; }

  if(!state.dq){
    buildDailySession(lang,false);
    const D=getDaily(lang);
    const sessions=todaySessions(D);
    const cfg=getDailyCfg();
    app.appendChild($(`<div class="topnav"><span class="backlink" id="back">← Home</span>
      <button class="small" id="histBtn">📊 History</button></div>`));
    app.querySelector('#back').onclick=()=>{ state.screen='home'; render(); };
    app.querySelector('#histBtn').onclick=()=>{ state.screen='dailyhist'; render(); };
    app.appendChild($(`<h1>${d.flag} Daily Exercise — ${todayStr()}</h1>`));

    // quiz-size settings (apply to the next NEW quiz)
    const sc=$(`<div class="card"><h2 style="margin-top:0;font-size:1rem">⚙ Quiz size <span class="pill">applies to the next new quiz</span></h2></div>`);
    const vRow=$(`<div class="opts" style="align-items:center"></div>`);
    vRow.appendChild($(`<span style="color:var(--muted);font-size:.9rem;width:90px">Vocabulary</span>`));
    for(const n of [5,10,15,20]){
      const o=$(`<div class="opt ${cfg.v===n?'sel':''}">${n}</div>`);
      o.onclick=()=>{ const c=getDailyCfg(); c.v=n; saveDailyCfg(c); render(); };
      vRow.appendChild(o);
    }
    const gRow=$(`<div class="opts" style="align-items:center"></div>`);
    gRow.appendChild($(`<span style="color:var(--muted);font-size:.9rem;width:90px">Grammar</span>`));
    for(const n of [3,5,8,10]){
      const o=$(`<div class="opt ${cfg.g===n?'sel':''}">${n}</div>`);
      o.onclick=()=>{ const c=getDailyCfg(); c.g=n; saveDailyCfg(c); render(); };
      gRow.appendChild(o);
    }
    sc.appendChild(vRow); sc.appendChild(gRow);
    app.appendChild(sc);

    // today's sessions
    for(const key of sessions){
      const srec=D.days[key];
      const gInfo=sessionGrammar(lang,srec);
      const concepts=[...new Set(gInfo.map(x=>x.unit.title.replace(/^Grammar[^:]*:\s*/,'')))].join(' + ');
      const nNew=srec.words.filter(w=>!w.review).length, nRev=srec.words.length-nNew;
      const card=$(`<div class="card"></div>`);
      card.appendChild($(`<h2 style="margin-top:0;font-size:1.05rem">Quiz ${srec.sess>1?'#'+srec.sess+' <span class="pill">extra</span>':'#1'} — Day ${srec.day}</h2>`));
      card.appendChild($(`<div style="margin:6px 0">📖 <b>${srec.words.length}</b> words: <b>${nNew} new</b>${nRev?` + <b>${nRev} review</b>`:''} · ✏️ <b>${gInfo.length}</b> grammar: <b>${concepts}</b></div>`));
      if(srec.attempts.length){

    } else {

  // ---- quiz runner ----
  const dq=state.dq;

  if(dq.done){
    const v=dq.vRes.filter(x=>x.ok).length;
    const pct=Math.round(100*(v+dq.gOk)/total);
    app.appendChild($(`<h1>${d.flag} Day ${dq.rec.day} — result</h1>`));
    const card=$(`<div class="card" style="text-align:center"></div>`);

    card.appendChild($(`<div class="sub">Vocabulary ${v}/${dq.vSeq.length} · Grammar ${dq.gOk}/${dq.gSeq.length}${pct===100?' — 🎯 perfect!':''}</div>`));
    const missedW=dq.vRes.filter(x=>!x.ok);
    if(missedW.length){
      const mc=$(`<div style="text-align:left;margin-top:8px"></div>`);
      mc.appendChild($(`<div style="font-weight:600;margin-bottom:4px">Missed words:</div>`));
      missedW.forEach(x=>mc.appendChild($(`<div class="missItem"><span class="w">${x.t}</span><span style="flex:1">${x.e}</span></div>`)));
      card.appendChild(mc);
    }
    const row=$(`<div class="row" style="justify-content:center;margin-top:14px"></div>`);
    const again=$(`<button class="primary">↻ Retake (goal 100%)</button>`);
    again.onclick=()=>startDailyRun(lang, dq.rec);
    const home=$(`<button>Done</button>`);
    home.onclick=()=>{ state.dq=null; render(); };
    const hist=$(`<button>📊 History</button>`);
    hist.onclick=()=>{ state.dq=null; state.screen='dailyhist'; render(); };
    row.appendChild(again); row.appendChild(home); row.appendChild(hist);
    card.appendChild(row);
    app.appendChild(card);
    return;
  }

  app.appendChild($(`<div class="topnav"><span class="backlink" id="quit">✕ Quit</span>
    <span style="color:var(--muted);font-size:.9rem">${d.flag} Day ${dq.rec.day} · ${dq.phase==='v'?'Vocabulary':'Grammar'}</span></div>`));
  app.querySelector('#quit').onclick=()=>{ if(confirm('Quit? This attempt won\'t be recorded.')){ state.dq=null; render(); } };
  app.appendChild($(`<div class="qTop"><span>Question ${pos+1} / ${total}</span><span>✔ ${dq.vRes.filter(x=>x.ok).length+dq.gOk}</span></div>`));
  const bar=$(`<div class="barOuter"><div class="barInner"></div></div>`);
  bar.firstElementChild.style.width=(pos/total*100)+'%';
  app.appendChild(bar);
  const card=$(`<div class="card"></div>`);
  app.appendChild(card);

  if(dq.phase==='v'){
    const w=dq.vSeq[dq.idx];
    card.appendChild($(`<div class="qWord">${nounPrompt(maskPrompt(w.e, w.t, lang), w.t)}</div>`));
    card.appendChild($(`<div class="qHint">Type the ${d.name} word${w.review?' · <span style="color:var(--warn)">review</span>':''} — accents optional; nouns need their article${CTRL_HINT[lang]||''}</div>`));
    const wrap=$(`<div style="max-width:560px;margin:0 auto;text-align:center"></div>`);
    const inp=$(`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;padding:14px 16px;font-size:1.1rem;border-radius:10px;border:2px solid var(--border);background:var(--card2);color:var(--text);outline:none" placeholder="Type here…">`);
    const accRow=$(`<div style="display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap"></div>`);
    (ACCENTS[lang]||[]).forEach(chr=>{
      const b=$(`<button class="small" style="min-width:38px;font-size:1.05rem">${chr}</button>`);
      const cb=comboFor(lang,chr); if(cb) b.title=cb;
      b.onclick=()=>{ const s=inp.selectionStart||inp.value.length; inp.value=inp.value.slice(0,s)+chr+inp.value.slice(inp.selectionEnd||s); inp.focus(); inp.setSelectionRange(s+1,s+1); };
      accRow.appendChild(b);
    });
    const go=$(`<button class="primary">Check</button>`);
    let checked=false;
    const doCheck=()=>{
      if(checked) return; checked=true;
      const ok=vocabAnswerOk(inp.value, w.t);
      const artMiss=!ok && answerMatches(inp.value, w.t);
      dq.vRes.push({t:w.t, e:w.e, ok});
      inp.disabled=true; go.style.display='none';
      inp.style.borderColor= ok?'var(--good)':'var(--bad)';
      const fb=$(`<div class="feedback"></div>`);
      fb.appendChild($(`<div style="font-weight:600;color:${ok?'var(--good)':'var(--bad)'}">${ok?'✔ Correct!':artMiss?'✘ Right word, but the article (gender) is wrong or missing — it\'s “'+w.t+'”':'✘ It\'s “'+w.t+'”'}</div>`));
      fb.appendChild($(`<div class="expl">${w.t} = ${w.e}${pluralNote(lang, w.t)}</div>`));
      if(window.speechSynthesis) speak(w.t, d.ttsLang);
      const next=$(`<button class="primary" style="margin-top:12px">Next →</button>`);
      next.onclick=()=>{
        dq.idx++;
        if(dq.idx>=dq.vSeq.length){ dq.phase='g'; dq.idx=0; }
        render();
      };
      fb.appendChild(next);
      card.appendChild(fb);
      next.focus();
    };
    go.onclick=doCheck;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); e.__consumed=true; window.__enterTs=Date.now(); doCheck(); } });
    wrap.appendChild(inp); wrap.appendChild(accRow); wrap.appendChild(go);
    card.appendChild(wrap);
    setTimeout(()=>inp.focus(),50);
  } else {
    // Lesson first: teach the concept(s), then the questions test it
    if(!dq.lessonDone){
      const lus=[...new Map(dq.gSeq.map(x=>[x.unit.id,x.unit])).values()].filter(u=>u.lesson);
      if(lus.length){
        card.appendChild($(`<h2 style="margin-top:0">📖 Today's grammar lesson</h2>`));
        for(const u of lus){
          card.appendChild($(`<div style="font-weight:600;color:var(--accent);margin:12px 0 6px">${u.title.replace(/^Grammar[^:]*:\s*/,'')}</div>`));
          card.appendChild($(`<div style="line-height:1.65">${u.lesson.replace(/\n/g,'<br>')}</div>`));
        }
        const go=$(`<button class="primary" style="margin-top:18px">Start the questions →</button>`);
        go.onclick=()=>{ if(window.speechSynthesis) speechSynthesis.cancel(); dq.lessonDone=true; render(); };
        card.appendChild(go);
        if(window.speechSynthesis){
          const rd=$(`<button class="small" style="margin-top:18px;margin-left:10px">🔊 Read the lesson aloud</button>`);
          rd.onclick=()=>{
            if(speechSynthesis.speaking || speechSynthesis.pending){
              speechSynthesis.cancel(); rd.textContent='🔊 Read the lesson aloud'; return;
            }
            const text=lus.map(u=>u.title.replace(/^Grammar[^:]*:\s*/,'')+'. '+u.lesson.replace(/\n+/g,' ')).join(' ');
            // chunk by sentence — Chrome cuts off long single utterances
            const parts=text.match(/[^.!?]+[.!?]?/g)||[text];
            const v=bestVoice('en-US');
            parts.forEach((s,i)=>{
              const u=new SpeechSynthesisUtterance(s.trim());
              u.lang='en-US'; if(v) u.voice=v; u.rate=1.0;
              if(i===parts.length-1) u.onend=()=>{ rd.textContent='🔊 Read the lesson aloud'; };
              speechSynthesis.speak(u);
            });
            rd.textContent='⏹ Stop reading';
          };
          card.appendChild(rd);
        }
        setTimeout(()=>go.focus(),50);
        return;
      }
      dq.lessonDone=true;
    }
    const {unit, q}=dq.gSeq[dq.idx];
    const correct=q.c[q.a];
    card.appendChild($(`<div class="qWord" style="font-size:1.25rem;line-height:1.5">${q.q}</div>`));
    card.appendChild($(`<div class="qHint">${unit.title.replace(/^Grammar[^:]*:\s*/,'')}</div>`));
    if(unit.lesson) card.appendChild($(`<details style="max-width:640px;margin:6px auto 4px;color:var(--muted)"><summary style="cursor:pointer;font-size:.9rem">📖 Review the lesson</summary><div style="text-align:left;line-height:1.6;margin-top:8px">${unit.lesson.replace(/\n/g,'<br>')}</div></details>`));
    const ch=$(`<div class="choices"></div>`);
    card.appendChild(ch);
    let answered=false;
    shuffle(q.c).forEach(c=>{
      const b=$(`<button class="choice"></button>`);
      b.textContent=c;
      b.onclick=()=>{
        if(answered) return; answered=true;
        const ok=c===correct;
        if(ok) dq.gOk++;
        [...ch.children].forEach(x=>{ if(x.textContent===correct) x.classList.add('correct'); else if(x===b) x.classList.add('wrong'); x.style.pointerEvents='none'; });
        const fb=$(`<div class="feedback"></div>`);
        fb.appendChild($(`<div style="font-weight:600;color:${ok?'var(--good)':'var(--bad)'}">${ok?'✔ Correct!':'✘ Not quite — “'+correct+'”'}</div>`));
        const fs=fullSentence(q.q, correct);
        if(fs) fb.appendChild($(`<div class="expl" style="font-size:1.05rem">${fs}</div>`));
        if(q.x) fb.appendChild($(`<div class="expl">${q.x}</div>`));
        if(q.ex) fb.appendChild($(`<div class="expl" style="font-size:1.05rem">${q.ex}</div>`));
        if(q.tr) fb.appendChild($(`<div class="expl" style="font-style:italic">🇬🇧 “${q.tr}”</div>`));
        const wg=wordGlossNote(lang, correct);
        if(wg) fb.appendChild($(`<div class="expl" style="color:var(--muted)">${wg}</div>`));
        const next=$(`<button class="primary" style="margin-top:12px">${dq.idx+1<dq.gSeq.length?'Next →':'Finish'}</button>`);
        next.onclick=()=>{
          dq.idx++;
          if(dq.idx>=dq.gSeq.length){
            dq.done=true;
            recordDailyAttempt(lang, dq.rec.key||dq.rec.date, dq.vRes, dq.gOk, dq.gSeq.length);
            state.dq={...dq};
          }
          render();
        };
        fb.appendChild(next);
        card.appendChild(fb);
        next.focus();
      };
      ch.appendChild(b);
    });
  }
}
